<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>许愿 · 江湖</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0806;font-family:"KaiTi","STKaiti","Microsoft YaHei",serif}

/* ===== 水墨夜空 ===== */
.ink-bg{position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(ellipse 58% 42% at 72% 18%, rgba(255,208,120,.17), transparent 62%),
    radial-gradient(ellipse 52% 46% at 20% 62%, rgba(158,64,42,.14), transparent 62%),
    radial-gradient(ellipse 90% 34% at 50% 92%, rgba(255,168,74,.16), transparent 70%),
    linear-gradient(180deg,#111730 0%,#1c1b2b 26%,#2e2318 54%,#2a1c12 74%,#150f0b 100%);
}

/* 明月 */
.moon{position:fixed;top:8%;right:12%;width:120px;height:120px;border-radius:50%;
  background:radial-gradient(circle at 40% 40%,#fff8e8,#f0d890 50%,#d4a850 80%,rgba(212,168,80,0) 100%);
  box-shadow:0 0 60px rgba(255,220,140,.4),0 0 120px rgba(255,200,100,.2);
  z-index:1;animation:moonGlow 4s ease-in-out infinite}
@keyframes moonGlow{0%,100%{box-shadow:0 0 60px rgba(255,220,140,.4)}50%{box-shadow:0 0 90px rgba(255,220,140,.6)}}
.moon::after{content:'';position:absolute;top:25%;left:30%;width:20px;height:20px;border-radius:50%;background:rgba(180,140,60,.2);filter:blur(2px)}

/* 星星 */
.stars{position:fixed;inset:0;z-index:1;pointer-events:none}
.star{position:absolute;background:#ffe8b0;border-radius:50%;animation:twinkle var(--dur) ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.7)}50%{opacity:.9;transform:scale(1.2)}}

/* 远山（水墨） */
.mountains{position:fixed;bottom:0;left:0;right:0;height:45%;z-index:2;pointer-events:none}
.mountain{position:absolute;bottom:0;background:linear-gradient(180deg,rgba(62,48,34,.62),rgba(20,14,9,.94))}
.mountain.m1{width:100%;height:100%;clip-path:polygon(0 100%,0 55%,10% 35%,22% 50%,35% 20%,48% 45%,60% 25%,75% 50%,88% 30%,100% 48%,100% 100%)}
.mountain.m2{width:75%;left:15%;height:65%;background:linear-gradient(180deg,rgba(78,60,40,.7),rgba(24,17,10,.95));clip-path:polygon(0 100%,0 65%,15% 40%,30% 60%,50% 30%,68% 55%,82% 38%,100% 58%,100% 100%)}

/* 竹林剪影 */
.bamboo{position:fixed;bottom:0;z-index:3;pointer-events:none;width:100%;height:60%}
.bamboo-stalk{position:absolute;bottom:0;width:6px;background:linear-gradient(90deg,rgba(20,30,15,.8),rgba(40,55,25,.6),rgba(20,30,15,.8));border-radius:3px}
.bamboo-stalk::before{content:'';position:absolute;top:0;left:-4px;right:-4px;height:100%;
  background:repeating-linear-gradient(180deg,transparent 0,transparent 40px,rgba(60,80,40,.5) 40px,rgba(60,80,40,.5) 43px)}
.bamboo-leaf{position:absolute;width:30px;height:8px;background:linear-gradient(90deg,rgba(50,70,30,.7),rgba(80,100,45,.5));border-radius:0 50% 50% 0;transform-origin:left center}

/* 云雾 */
.mist{position:fixed;z-index:4;pointer-events:none;height:120px;width:200%;
  background:linear-gradient(90deg,transparent,rgba(200,180,140,.06) 30%,rgba(220,200,160,.1) 50%,rgba(200,180,140,.06) 70%,transparent);
  filter:blur(20px);animation:mistDrift linear infinite}
.mist.m1{top:30%;animation-duration:25s}
.mist.m2{top:50%;animation-duration:35s;animation-direction:reverse;opacity:.6}
@keyframes mistDrift{0%{transform:translateX(-25%)}100%{transform:translateX(0%)}}

/* 飘落花瓣 */
.petals{position:fixed;inset:0;z-index:5;pointer-events:none}
.petal{position:absolute;width:12px;height:12px;background:radial-gradient(circle at 30% 30%,#ffb8c8,#d4455a);border-radius:0 60% 0 60%;opacity:.5;animation:petalFall linear infinite;transform:rotate(45deg)}
@keyframes petalFall{
  0%{transform:translateY(-10vh) translateX(0) rotate(45deg);opacity:0}
  10%{opacity:.6}
  90%{opacity:.6}
  100%{transform:translateY(110vh) translateX(80px) rotate(405deg);opacity:0}
}

/* 烟花canvas */
#fw{position:fixed;inset:0;z-index:9;pointer-events:none}

/* 整体镜头呼吸 */
.wrap{position:relative;z-index:7;width:100%;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  animation:cameraBreath 8s ease-in-out infinite}
@keyframes cameraBreath{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}

/* 暗角 */
.vignette{position:fixed;inset:0;z-index:11;pointer-events:none;
  background:radial-gradient(ellipse 78% 70% at 50% 46%,transparent 46%,rgba(0,0,0,.42) 100%)}

/* 银河 */
.galaxy{position:fixed;top:-20%;left:-10%;width:120%;height:60%;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse at 30% 50%,rgba(180,140,255,.08),transparent 50%),
             radial-gradient(ellipse at 70% 40%,rgba(255,180,100,.06),transparent 40%);
  transform:rotate(-15deg);animation:galaxyRotate 60s linear infinite}
@keyframes galaxyRotate{0%{transform:rotate(-15deg) scale(1)}50%{transform:rotate(-12deg) scale(1.05)}100%{transform:rotate(-15deg) scale(1)}}

/* 萤火虫 */
.fireflies{position:fixed;inset:0;z-index:4;pointer-events:none}
.firefly{position:absolute;width:4px;height:4px;background:#aaff88;border-radius:50%;
  box-shadow:0 0 8px #aaff88,0 0 16px rgba(170,255,136,.5);
  animation:fireflyFloat linear infinite}
@keyframes fireflyFloat{
  0%{transform:translate(0,0);opacity:0}
  20%{opacity:.9}
  80%{opacity:.7}
  100%{transform:translate(var(--fx),var(--fy));opacity:0}
}

/* 流星 */
.meteor{position:fixed;z-index:2;pointer-events:none;width:2px;height:2px;background:#fff;border-radius:50%;
  box-shadow:0 0 6px #fff,0 0 12px rgba(255,220,150,.8);opacity:0}
.meteor::after{content:'';position:absolute;top:0;right:0;width:80px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,220,150,.8))}
.meteor.active{animation:meteorFall 1.2s ease-out forwards}
@keyframes meteorFall{
  0%{opacity:0;transform:translate(0,0) rotate(35deg)}
  10%{opacity:1}
  100%{opacity:0;transform:translate(400px,280px) rotate(35deg)}
}

/* 标题（书法风） */
.title{
  font-size:clamp(30px,5.5vw,58px);font-weight:900;letter-spacing:.4em;
  color:#f0d890;
  text-shadow:0 0 20px rgba(255,180,60,.4),2px 2px 0 rgba(80,30,20,.8);
  margin-bottom:6px;animation:titleIn 1.2s ease;
  position:relative;
}
.title::before{content:'';position:absolute;left:-30px;top:50%;width:20px;height:2px;background:linear-gradient(90deg,transparent,#c8a050)}
.title::after{content:'';position:absolute;right:-30px;top:50%;width:20px;height:2px;background:linear-gradient(90deg,#c8a050,transparent)}
@keyframes titleIn{from{opacity:0;transform:translateY(-30px);letter-spacing:.8em}to{opacity:1;transform:translateY(0);letter-spacing:.4em}}

.subtitle{font-size:clamp(12px,1.4vw,16px);color:rgba(200,170,110,.6);letter-spacing:.5em;margin-bottom:45px;animation:fadeIn 1.5s ease .4s both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ===== 武侠蛋糕（山门造型） ===== */
.cake-stage{position:relative;width:300px;height:240px;animation:cakeFloat 5s ease-in-out infinite, cakeIn 1.2s ease .3s both}
@keyframes cakeFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes cakeIn{from{opacity:0;transform:translateY(50px) scale(.7)}to{opacity:1;transform:translateY(0) scale(1)}}

/* 底部光晕 */
.cake-glow{position:absolute;bottom:-30px;left:50%;transform:translateX(-50%);width:280px;height:70px;
  background:radial-gradient(ellipse,rgba(255,160,60,.25),transparent 70%);filter:blur(15px);animation:glowPulse 3s ease-in-out infinite}
@keyframes glowPulse{0%,100%{opacity:.4}50%{opacity:.7}}

/* 基座（青石板） */
.cake-base{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:280px;height:20px;
  background:linear-gradient(180deg,#4a4035,#2a2218);border-radius:4px;box-shadow:0 4px 15px rgba(0,0,0,.5)}

/* 第一层（朱红山门底座） */
.cake-l1{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);width:240px;height:50px;
  background:linear-gradient(180deg,#8b2520,#5c1510);border-radius:4px;
  box-shadow:inset 0 4px 8px rgba(255,100,60,.3),0 4px 15px rgba(0,0,0,.4)}
.cake-l1::before{content:'';position:absolute;top:-6px;left:0;right:0;height:10px;
  background:linear-gradient(180deg,#d4a050,#a07030);border-radius:4px 4px 0 0}
/* 门钉 */
.cake-l1::after{content:'';position:absolute;top:15px;left:10%;right:10%;height:20px;
  background:radial-gradient(circle at 15px 10px,#d4a050 4px,transparent 5px) 0 0/30px 20px repeat-x}

/* 第二层（飞檐） */
.cake-l2{position:absolute;bottom:70px;left:50%;transform:translateX(-50%);width:180px;height:40px;
  background:linear-gradient(180deg,#6b1818,#4a0e0e);border-radius:4px 4px 0 0;
  box-shadow:inset 0 3px 6px rgba(255,80,50,.25)}
.cake-l2::before{content:'';position:absolute;top:-14px;left:-15px;right:-15px;height:18px;
  background:linear-gradient(180deg,#c89040,#8b5a20);
  clip-path:polygon(5% 100%,0 40%,10% 0,90% 0,100% 40%,95% 100%);
  box-shadow:0 2px 8px rgba(0,0,0,.3)}
/* 飞檐角 */
.cake-l2::after{content:'';position:absolute;top:-18px;left:-20px;right:-20px;height:8px;
  background:linear-gradient(90deg,transparent 5%,#c89040 10%,#c89040 90%,transparent 95%);
  border-radius:4px}

/* 第三层（顶层小宝殿） */
.cake-l3{position:absolute;bottom:110px;left:50%;transform:translateX(-50%);width:110px;height:32px;
  background:linear-gradient(180deg,#7a1e1a,#521010);border-radius:3px 3px 0 0}
.cake-l3::before{content:'';position:absolute;top:-10px;left:-10px;right:-10px;height:14px;
  background:linear-gradient(180deg,#d4a050,#9a6828);
  clip-path:polygon(8% 100%,0 30%,15% 0,85% 0,100% 30%,92% 100%)}
/* 宝顶 */
.cake-l3::after{content:'';position:absolute;top:-22px;left:50%;transform:translateX(-50%);
  width:8px;height:16px;background:linear-gradient(180deg,#ffd700,#b8860b);border-radius:4px 4px 0 0}

/* 牌匾 */
.plaque{position:absolute;bottom:122px;left:50%;transform:translateX(-50%);
  width:80px;height:26px;background:linear-gradient(180deg,#1a0a05,#0d0502);
  border:2px solid #c89040;border-radius:3px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 15px rgba(255,180,60,.3),inset 0 0 10px rgba(255,150,40,.15);z-index:2}
.plaque span{font-size:14px;color:#ffd700;letter-spacing:.3em;font-weight:bold;
  text-shadow:0 0 8px rgba(255,180,60,.8)}

/* 灯笼 */
.lantern-hang{position:absolute;bottom:148px;width:18px;height:24px;z-index:2;
  animation:lanternSway 3s ease-in-out infinite}
.lantern-hang.l{left:calc(50% - 70px)}
.lantern-hang.r{left:calc(50% + 52px);animation-delay:-1.5s}
.lantern-hang::before{content:'';position:absolute;top:-8px;left:50%;transform:translateX(-50%);
  width:1px;height:8px;background:#8b4513}
.lantern-hang::after{content:'';position:absolute;top:0;left:0;right:0;bottom:0;
  background:radial-gradient(ellipse at 50% 40%,#ff6644,#cc2200);
  border-radius:50% 50% 45% 45%;
  box-shadow:0 0 15px rgba(255,80,40,.6),0 0 30px rgba(255,60,20,.3)}
@keyframes lanternSway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}

/* 香（代替蜡烛） */
.incenses{position:absolute;bottom:142px;left:50%;transform:translateX(-50%);display:flex;gap:20px;z-index:3}
.incense{position:relative;width:4px;height:42px;background:linear-gradient(180deg,#8b4513,#5c2e0a,#3d1f05);border-radius:2px;cursor:pointer;transition:transform .15s}
.incense:hover{transform:scale(1.2)}
.incense .tip{position:absolute;top:-3px;left:50%;transform:translateX(-50%);width:5px;height:5px;background:#333;border-radius:50%;transition:all .3s}
.incense.lit .tip{background:radial-gradient(circle,#ff6600,#ff3300);box-shadow:0 0 8px #ff4400,0 0 16px rgba(255,100,0,.5);animation:emberPulse 1s ease-in-out infinite}
@keyframes emberPulse{0%,100%{box-shadow:0 0 6px #ff4400,0 0 12px rgba(255,100,0,.4)}50%{box-shadow:0 0 12px #ff6600,0 0 24px rgba(255,100,0,.6)}}
/* 香烟 */
.incense .smoke{position:absolute;top:-20px;left:50%;transform:translateX(-50%);width:6px;height:6px;background:rgba(180,160,120,.3);border-radius:50%;opacity:0;pointer-events:none;filter:blur(2px)}
.incense.lit .smoke{animation:smokeRise 2s ease-out infinite}
.incense:not(.lit) .smoke{animation:smokeBurst 1.5s ease-out forwards}
@keyframes smokeRise{
  0%{opacity:.4;transform:translateX(-50%) translateY(0) scale(1)}
  50%{opacity:.25;transform:translateX(-30%) translateY(-15px) scale(1.5)}
  100%{opacity:0;transform:translateX(-60%) translateY(-35px) scale(2)}
}
@keyframes smokeBurst{
  0%{opacity:.6;transform:translateX(-50%) translateY(0) scale(1)}
  100%{opacity:0;transform:translateX(-50%) translateY(-40px) scale(3)}
}

/* 提示 */
.hint{margin-top:35px;font-size:clamp(12px,1.4vw,16px);color:rgba(200,170,110,.6);letter-spacing:.3em;animation:pulse 1.5s ease-in-out infinite;transition:opacity .8s}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:.8}}

/* 结局大字 */
.wish-text{position:fixed;top:22%;left:50%;transform:translate(-50%,-50%);z-index:10;pointer-events:none;opacity:0;white-space:nowrap}
.wish-text.show{opacity:1}
.wish-text span{font-size:clamp(38px,7.5vw,88px);font-weight:900;color:#f0d890;
  text-shadow:0 0 30px rgba(255,180,60,.6),0 0 60px rgba(255,120,40,.4),3px 3px 0 rgba(80,20,10,.9);
  letter-spacing:.1em;display:inline-block;opacity:0;transform:translateY(40px) scale(.5)}
.wish-text.show span{animation:wishCharIn .8s cubic-bezier(.2,1.5,.4,1) forwards}
.wish-text.show .w1{animation-delay:.1s}
.wish-text.show .w2{animation-delay:.25s}
.wish-text.show .w3{animation-delay:.4s}
.wish-text.show .w4{animation-delay:.55s}
@keyframes wishCharIn{
  0%{opacity:0;transform:translateY(40px) scale(.5) rotate(-10deg)}
  60%{opacity:1;transform:translateY(-8px) scale(1.15) rotate(3deg)}
  100%{opacity:1;transform:translateY(0) scale(1) rotate(0)}
}
/* 金光扫过 */
.wish-sheen{position:absolute;top:0;left:-20%;width:30%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,200,.6),transparent);
  filter:blur(8px);opacity:0;transform:skewX(-20deg)}
.wish-text.show .wish-sheen{animation:sheenSweep 1.2s ease .9s forwards}
@keyframes sheenSweep{0%{left:-20%;opacity:0}20%{opacity:1}100%{left:120%;opacity:0}}
/* 小字祝福 */
.wish-sub{margin-top:18px;font-size:clamp(13px,1.6vw,20px);color:rgba(240,216,144,.75);
  letter-spacing:.5em;opacity:0;text-shadow:0 0 15px rgba(255,180,60,.4)}
.wish-text.show .wish-sub{animation:wishSubIn 1.2s ease 1.4s forwards}
@keyframes wishSubIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}

/* 全灭后淡出其他元素 */
.wrap.finale .title,.wrap.finale .subtitle,.wrap.finale .hint{opacity:0!important}
.wrap.finale .cake-stage{transform:scale(.8);opacity:.6;transition:all 1s ease}

/* 返回按钮 */
.back{position:fixed;top:20px;left:20px;z-index:20;background:rgba(60,40,20,.4);border:1px solid rgba(200,160,80,.3);color:rgba(220,190,130,.7);padding:10px 22px;border-radius:4px;cursor:pointer;font-size:13px;letter-spacing:.2em;transition:all .3s;backdrop-filter:blur(8px);font-family:inherit}
.back:hover{background:rgba(80,50,25,.6);color:#f0d890;border-color:rgba(200,160,80,.6)}

/* ===== 武侠猫咪 ===== */
.cat{position:absolute;bottom:10px;left:-80px;width:70px;height:55px;z-index:4;transition:left 1.5s cubic-bezier(.2,.8,.2,1)}
.cat.enter{left:calc(50% - 180px)}
.cat-body{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:50px;height:32px;
  background:linear-gradient(180deg,#c8c0b0,#9a9080);border-radius:25px 25px 20px 20px}
.cat-head{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);width:32px;height:28px;
  background:linear-gradient(180deg,#d0c8b8,#a09888);border-radius:50% 50% 45% 45%}
.cat-ear{position:absolute;top:-6px;width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:12px solid #b0a898}
.cat-ear.l{left:2px;transform:rotate(-15deg)}.cat-ear.r{right:2px;transform:rotate(15deg)}
.cat-ear::after{content:'';position:absolute;top:4px;left:-4px;width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-bottom:7px solid #e8a0a0}
.cat-eye{position:absolute;top:10px;width:5px;height:6px;background:#2a1a0a;border-radius:50%;animation:catBlink 4s ease-in-out infinite}
.cat-eye.l{left:7px}.cat-eye.r{right:7px}
@keyframes catBlink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.cat-nose{position:absolute;top:15px;left:50%;transform:translateX(-50%);width:4px;height:3px;background:#d4708a;border-radius:50%}
.cat-whisker{position:absolute;top:16px;width:12px;height:1px;background:rgba(60,40,20,.5)}
.cat-whisker.l1{left:-6px;transform:rotate(-10deg)}.cat-whisker.l2{left:-6px;top:19px;transform:rotate(5deg)}
.cat-whisker.r1{right:-6px;transform:rotate(10deg)}.cat-whisker.r2{right:-6px;top:19px;transform:rotate(-5deg)}
.cat-collar{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);width:26px;height:5px;background:linear-gradient(180deg,#c83020,#8b1a10);border-radius:2px}
.cat-collar::after{content:'';position:absolute;bottom:-3px;left:50%;transform:translateX(-50%);width:6px;height:6px;background:radial-gradient(circle,#ffd700,#b8860b);border-radius:50%}
.cat-tail{position:absolute;bottom:8px;right:-8px;width:25px;height:8px;background:linear-gradient(90deg,#a09888,#c8c0b0);border-radius:10px;transform-origin:left center;animation:tailSway 2s ease-in-out infinite}
@keyframes tailSway{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(20deg)}}
.cat.look-up .cat-head{transform:translateX(-50%) rotate(-10deg);transition:transform .3s}
.cat.look-up .cat-eye{top:8px}
.cat.wish .cat-eye{transform:scaleY(.1);transition:transform .4s}
.cat.wish .cat-head{transform:translateX(-50%) rotate(-5deg);transition:transform .4s}
.cat.gaze-moon{transition:all 1s ease}
.cat.gaze-moon .cat-head{transform:translateX(-50%) rotate(-20deg);transition:transform .8s}

/* 剑影掠过 */
.sword-slash{position:fixed;z-index:6;pointer-events:none;height:3px;
  background:linear-gradient(90deg,transparent,#fff 30%,#ffd700 50%,#fff 70%,transparent);
  box-shadow:0 0 15px rgba(255,215,0,.8),0 0 30px rgba(255,215,0,.4);
  opacity:0;transform:rotate(-25deg)}
.sword-slash.active{animation:slashMove .8s ease-out forwards}
@keyframes slashMove{
  0%{opacity:0;left:-20%;width:0}
  20%{opacity:1;width:40%}
  80%{opacity:.8;left:80%;width:40%}
  100%{opacity:0;left:120%;width:40%}
}

/* 转场层 */
.transition-canvas{position:fixed;inset:0;z-index:50;pointer-events:none;opacity:0}
.transition-canvas.active{opacity:1}

/* 许愿仪式遮罩 */
.ritual{position:fixed;inset:0;z-index:15;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:
    radial-gradient(ellipse 46% 40% at 50% 62%, rgba(255,166,70,.13), transparent 68%),
    radial-gradient(ellipse 90% 80% at 50% 50%, rgba(10,8,14,.72), rgba(4,3,6,.92));
  backdrop-filter:blur(4px);transition:opacity 1s,visibility 1s}
.ritual.hide{opacity:0;visibility:hidden}
.ritual-text{font-size:clamp(20px,3vw,36px);color:#d4a850;letter-spacing:.5em;margin-bottom:20px;
  text-shadow:0 0 20px rgba(255,180,60,.5);animation:ritualPulse 2s ease-in-out infinite}
@keyframes ritualPulse{0%,100%{opacity:.6}50%{opacity:1}}
.ritual-sub{font-size:clamp(12px,1.4vw,16px);color:rgba(200,170,110,.5);letter-spacing:.3em}
.ritual-incense{font-size:40px;margin-top:30px;animation:incenseGlow 1.5s ease-in-out infinite}
@keyframes incenseGlow{0%,100%{filter:drop-shadow(0 0 10px #ff6600)}50%{filter:drop-shadow(0 0 25px #ff8800)}}

/* 屏幕震动 */
.shake{animation:shake .3s ease}
@keyframes shake{0%,100%{transform:translate(0,0)}25%{transform:translate(-4px,2px)}50%{transform:translate(3px,-2px)}75%{transform:translate(-2px,-1px)}}

/* 孔明灯 */
.lantern{position:fixed;width:30px;height:40px;z-index:5;pointer-events:none;opacity:0}
.lantern::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,#ff8844,#cc4400);border-radius:50% 50% 45% 45%;box-shadow:0 0 20px rgba(255,120,40,.6)}
.lantern::after{content:'';position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);width:14px;height:4px;background:#8b4513;border-radius:2px}
.lantern.rise{animation:lanternRise 8s ease-out forwards}
@keyframes lanternRise{
  0%{opacity:0;transform:translateY(0) scale(.5)}
  10%{opacity:1}
  90%{opacity:.9}
  100%{opacity:0;transform:translateY(-100vh) scale(1.2) translateX(30px)}
}

/* ============================================================
   ===== 终章强化层（与 03 / 04 页统一的水墨武侠电影感）=====
   ============================================================ */

/* --- 明月重塑：清晰月盘 + 呼吸月晕 --- */
.moon{
  width:clamp(96px,10vw,150px);height:clamp(96px,10vw,150px);top:7%;right:11%;
  background:
    radial-gradient(circle at 42% 36%, #fffdf6 0%, #fdf6de 34%, #f5e4b4 58%, #e8cd8c 74%, rgba(232,205,140,0) 78%),
    radial-gradient(circle at 50% 50%, rgba(255,238,186,.5), transparent 70%);
  box-shadow:
    0 0 34px rgba(255,235,175,.55),
    0 0 96px rgba(255,208,115,.30),
    0 0 200px rgba(255,178,70,.15);
}
.moon::before{content:'';position:absolute;inset:-46%;border-radius:50%;
  background:radial-gradient(circle, rgba(255,228,158,.15) 38%, rgba(255,208,112,.06) 56%, transparent 72%);
  animation:moonHalo 7s ease-in-out infinite}
@keyframes moonHalo{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.09);opacity:1}}
.moon::after{top:30%;left:34%;width:16px;height:16px;background:rgba(186,150,74,.18);filter:blur(3px);
  box-shadow:14px -10px 0 -4px rgba(186,150,74,.13), -6px 12px 0 -5px rgba(186,150,74,.1)}

/* --- 水墨暗角 + 宣纸颗粒（压在场景之上、烟花之下）--- */
.grain{position:fixed;inset:0;z-index:8;pointer-events:none;mix-blend-mode:multiply;
  background:
    radial-gradient(ellipse 78% 66% at 50% 44%, transparent 40%, rgba(8,5,10,.26) 72%, rgba(3,2,5,.72) 100%),
    repeating-linear-gradient(0deg, rgba(255,255,255,.016) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, rgba(0,0,0,.022) 0 1px, transparent 1px 4px)}

/* --- 电影黑边 --- */
.cine{position:fixed;inset:0;z-index:13;pointer-events:none;opacity:0;transition:opacity 1.2s ease}
.cine.on{opacity:1}
.cine i{position:absolute;left:0;right:0;height:9vh;background:#04040a;display:block}
.cine i.t{top:0}
.cine i.b{bottom:0}

/* --- 「万剑归宗」标题 --- */
.swords-title{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%) scale(.72);z-index:10;
  font-size:clamp(18px,3.2vw,42px);font-weight:900;letter-spacing:.62em;color:rgba(255,238,196,.94);
  text-shadow:0 0 22px rgba(255,196,86,.9),0 0 58px rgba(255,140,40,.55);
  opacity:0;pointer-events:none;white-space:nowrap;padding-left:.62em;
  transition:opacity .55s,transform 1.2s cubic-bezier(.2,1,.3,1);font-family:"STKaiti","KaiTi",serif}
.swords-title.on{opacity:1;transform:translate(-50%,-50%) scale(1)}

/* --- 落款印章 --- */
.seal-final{position:fixed;right:6%;bottom:13%;z-index:16;width:clamp(56px,6.6vw,84px);aspect-ratio:1;
  display:flex;align-items:center;justify-content:center;border-radius:7px;
  background:linear-gradient(135deg,#c23b2a,#93261a);
  box-shadow:0 0 24px rgba(200,60,34,.45), inset 0 0 14px rgba(0,0,0,.28), 0 0 0 2px rgba(255,220,190,.15);
  opacity:0;transform:scale(2.4) rotate(-14deg);pointer-events:none}
.seal-final span{writing-mode:vertical-rl;text-orientation:upright;color:#ffeee0;
  font-size:clamp(11px,1.3vw,16px);letter-spacing:.2em;font-weight:700;
  text-shadow:0 0 5px rgba(0,0,0,.45)}
.seal-final.stamp{animation:stampIn .55s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes stampIn{
  0%{opacity:0;transform:scale(2.4) rotate(-14deg)}
  55%{opacity:1;transform:scale(.9) rotate(-4deg)}
  76%{transform:scale(1.05) rotate(-7deg)}
  100%{opacity:.94;transform:scale(1) rotate(-6deg)}
}

/* --- 终章操作区 --- */
.final-actions{position:fixed;left:50%;bottom:13%;transform:translateX(-50%) translateY(26px);z-index:15;
  display:flex;flex-direction:column;align-items:center;gap:14px;
  opacity:0;pointer-events:none;transition:opacity 1s .2s,transform 1s .2s}
.final-actions.on{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.final-actions button{font-family:inherit;font-size:clamp(14px,1.55vw,18px);letter-spacing:.32em;
  padding:13px 36px 13px 40px;border-radius:999px;cursor:pointer;color:#2c1a06;border:1px solid rgba(255,244,200,.92);
  background:linear-gradient(180deg,#ffeeb2,#e9b953 58%,#c8912f);
  box-shadow:0 6px 26px rgba(255,190,80,.36), inset 0 1px 0 rgba(255,255,255,.75);
  transition:transform .25s,box-shadow .25s}
.final-actions button:hover{transform:translateY(-2px);
  box-shadow:0 12px 34px rgba(255,190,80,.5), inset 0 1px 0 rgba(255,255,255,.85)}
.auto-tip{font-size:clamp(11px,1.25vw,14px);color:rgba(230,205,150,.55);letter-spacing:.16em}
.auto-tip b{color:#ffd98a;font-weight:600}

/* --- 标题换楷体 + 鎏金 --- */
.title{font-family:"STKaiti","KaiTi","Kaiti SC","Songti SC",serif;font-weight:700;
  background:linear-gradient(180deg,#fff4d2 0%,#f6dd93 36%,#e0b055 64%,#b9822f 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  text-shadow:none;filter:drop-shadow(0 0 18px rgba(255,190,80,.45)) drop-shadow(0 3px 6px rgba(60,22,0,.65))}
.wish-text{top:26%}
.wish-text span{font-family:"STKaiti","KaiTi","STSong",serif}

/* --- 香火加粗放大 --- */
.incenses{gap:26px;bottom:146px}
.incense{width:5px;height:54px;border-radius:3px}
.incense .tip{width:6px;height:6px}
.incense.lit .tip{box-shadow:0 0 10px #ff4400,0 0 22px rgba(255,110,0,.6)}

@media (max-width:640px){
  .seal-final{right:5%;bottom:6%;width:clamp(48px,15vw,64px)}
  .final-actions{bottom:8%}
  .swords-title{letter-spacing:.4em;padding-left:.4em}
}
</style>
</head>
<body>
<div class="ink-bg"></div>
<div class="galaxy"></div>
<div class="moon"></div>
<div class="stars" id="stars"></div>
<div class="mountains"><div class="mountain m1"></div><div class="mountain m2"></div></div>
<div class="bamboo" id="bamboo"></div>
<div class="mist m1"></div><div class="mist m2"></div>
<div class="petals" id="petals"></div>
<div class="fireflies" id="fireflies"></div>
<canvas id="fw"></canvas>
<canvas id="transition" class="transition-canvas"></canvas>
<div class="vignette"></div>
<div class="grain"></div>
<div class="cine" id="cine"><i class="t"></i><i class="b"></i></div>
<div class="swords-title" id="swordsTitle">万 剑 归 宗</div>

  <button id="goNext">展 开 信 笺 →</button>
  <div class="auto-tip" id="autoTip"></div>
</div>
<div class="wish-text" id="wishText"><span class="w1">所</span><span class="w2">愿</span><span class="w3">皆</span><span class="w4">成</span><div class="wish-sheen"></div><div class="wish-sub">生辰快乐 · 岁岁平安</div></div>
<button class="back" onclick="history.back()">← 返回</button>

<!-- 许愿仪式 -->
<div class="ritual" id="ritual">
  <div class="ritual-text">闭目许愿</div>
  <div class="ritual-sub">心中默念你的愿望</div>
  <div class="ritual-incense">🕯️</div>
</div>

<div class="wrap" id="wrap">
  <div class="title">少侠许愿</div>
  <div class="subtitle">一 香 一 愿 · 弹 指 即 灭</div>
  <div class="cake-stage" id="cakeStage">
    <div class="cake-glow"></div>
    <div class="cake-base"></div>
    <div class="cake-l1"></div>
    <div class="cake-l2"></div>
    <div class="cake-l3"></div>
    <div class="plaque"><span>许愿</span></div>
    <div class="lantern-hang l"></div>
    <div class="lantern-hang r"></div>
    <div class="incenses" id="incenses"></div>
    <!-- 猫咪 -->
    <div class="cat" id="cat">
      <div class="cat-tail"></div>
      <div class="cat-body"></div>
      <div class="cat-collar"></div>
      <div class="cat-head">
        <div class="cat-ear l"></div><div class="cat-ear r"></div>
        <div class="cat-eye l"></div><div class="cat-eye r"></div>
        <div class="cat-nose"></div>
        <div class="cat-whisker l1"></div><div class="cat-whisker l2"></div>
        <div class="cat-whisker r1"></div><div class="cat-whisker r2"></div>
      </div>
    </div>
  </div>
  <div class="hint" id="hint">点击香 · 吹灭许愿</div>
</div>

<script>
const CONFIG = {
  incenseCount: 5,
  nextPage: '03-生辰信笺.html',
  autoJumpDelay: 17000,   // 全灭后停留秒数（让烟花/孔明灯/万剑归宗完整演完）
  sealDelay: 2600,        // 盖印章时刻
  warriorName: '少侠',
  sealText: ['岁','岁','平','安'],
};

/* ===== 背景 ===== */
// 星星
const starsEl=document.getElementById('stars');
for(let i=0;i<100;i++){
  const s=document.createElement('div');s.className='star';
  s.style.left=Math.random()*100+'%';s.style.top=Math.random()*60+'%';
  const sz=1+Math.random()*2;s.style.width=s.style.height=sz+'px';
  s.style.setProperty('--dur',(2+Math.random()*4)+'s');
  s.style.animationDelay=(Math.random()*4)+'s';
  starsEl.appendChild(s);
}
// 竹林
const bambooEl=document.getElementById('bamboo');
for(let i=0;i<12;i++){
  const stalk=document.createElement('div');stalk.className='bamboo-stalk';
  const h=40+Math.random()*50;stalk.style.height=h+'%';
  stalk.style.left=(i*8.5+Math.random()*4)+'%';
  stalk.style.opacity=(.3+Math.random()*.4);
  // 竹叶
  for(let j=0;j<3;j++){
    const leaf=document.createElement('div');leaf.className='bamboo-leaf';
    leaf.style.top=(20+j*25+Math.random()*10)+'%';
    leaf.style.left=j%2===0?'100%':'auto';leaf.style.right=j%2===0?'auto':'100%';
    leaf.style.transform=`rotate(${j%2===0?'-20':'200'}deg)`;
    stalk.appendChild(leaf);
  }
  bambooEl.appendChild(stalk);
}
// 花瓣
const petalsEl=document.getElementById('petals');
for(let i=0;i<18;i++){
  const p=document.createElement('div');p.className='petal';
  p.style.left=Math.random()*100+'%';
  p.style.animationDuration=(10+Math.random()*10)+'s';
  p.style.animationDelay=(Math.random()*12)+'s';
  p.style.width=p.style.height=(8+Math.random()*8)+'px';
  petalsEl.appendChild(p);
}
// 萤火虫
const firefliesEl=document.getElementById('fireflies');
for(let i=0;i<30;i++){
  const f=document.createElement('div');f.className='firefly';
  f.style.left=Math.random()*100+'%';
  f.style.top=(30+Math.random()*60)+'%';
  f.style.setProperty('--fx',(Math.random()-.5)*200+'px');
  f.style.setProperty('--fy',-(50+Math.random()*150)+'px');
  f.style.animationDuration=(6+Math.random()*8)+'s';
  f.style.animationDelay=(Math.random()*8)+'s';
  f.style.width=f.style.height=(2+Math.random()*3)+'px';
  firefliesEl.appendChild(f);
}

/* ===== 香 ===== */
const incensesEl=document.getElementById('incenses');
const hintEl=document.getElementById('hint');
const wishText=document.getElementById('wishText');
for(let i=0;i<CONFIG.incenseCount;i++){
  const c=document.createElement('div');c.className='incense lit';
  c.innerHTML='<div class="tip"></div><div class="smoke"></div>';
  c.addEventListener('click',e=>extinguish(c,e));
  incensesEl.appendChild(c);
}

let extinguished=0;
let ritualDone=false;

// 页面初始化
function initPage(){
  startBGM();
  // 3秒后仪式结束，直接进入主场景
  setTimeout(()=>{
    document.getElementById('ritual').classList.add('hide');
    setTimeout(()=>document.getElementById('cat').classList.add('enter'),300);
    setTimeout(()=>{
      document.querySelectorAll('.incense').forEach((c,i)=>{
        setTimeout(()=>c.classList.add('lit'),i*150);
      });
      ritualDone=true;
    },800);
    setInterval(spawnSwordSlash, 6000+Math.random()*4000);
    // 流星
    setInterval(()=>{
      const m=document.createElement('div');m.className='meteor';
      m.style.left=(10+Math.random()*40)+'%';
      m.style.top=(5+Math.random()*25)+'%';
      document.body.appendChild(m);
      requestAnimationFrame(()=>m.classList.add('active'));
      setTimeout(()=>m.remove(),1300);
    },4000+Math.random()*3000);
  },3000);
}
if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',initPage);
}else{
  initPage();
}

function spawnSwordSlash(){
  if(document.querySelector('.wrap.finale'))return;
  const s=document.createElement('div');s.className='sword-slash';
  s.style.top=(15+Math.random()*50)+'%';
  document.body.appendChild(s);
  requestAnimationFrame(()=>s.classList.add('active'));
  setTimeout(()=>s.remove(),900);
  // 剑鸣声
  try{
    ensureAudio();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type='sawtooth';o.frequency.setValueAtTime(2000,audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(400,audioCtx.currentTime+.15);
    g.gain.setValueAtTime(.08,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.2);
    o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.2);
  }catch(e){}
}

function extinguish(el,e){
  try{
  if(!ritualDone||!el.classList.contains('lit'))return;
  el.classList.remove('lit');
  extinguished++;
  playExtinguishSound();
  // 猫咪抬头看
  const cat=document.getElementById('cat');
  cat.classList.add('look-up');
  setTimeout(()=>cat.classList.remove('look-up'),600);
  // 火星
  const r=el.getBoundingClientRect();
  spawnSparks(r.left+r.width/2,r.top);
  // 画面闪白
  flashWhite(.12);
  // 震动
  document.body.classList.add('shake');
  setTimeout(()=>document.body.classList.remove('shake'),250);
  // 全灭
  if(extinguished>=CONFIG.incenseCount){
    // 最后一根：许愿停顿——猫咪闭眼，画面微暖
    const cat=document.getElementById('cat');
    cat.classList.add('wish');
    document.body.style.transition='filter 1s';
    document.body.style.filter='brightness(1.15) saturate(1.2)';
    setTimeout(finale,900);
  }
  }catch(err){console.error('extinguish error:',err)}
}

// 冲击波光环
function spawnShockwave(x,y){
  tCanvas.classList.add('active');
  let r=5,alpha=.8;
  const anim=()=>{
    r+=12;alpha-=.025;
    if(alpha<=0){tCanvas.classList.remove('active');tCtx.clearRect(x-r-5,y-r-5,r*2+10,r*2+10);return}
    tCtx.strokeStyle=`rgba(255,200,80,${alpha})`;
    tCtx.lineWidth=3;
    tCtx.shadowBlur=20;tCtx.shadowColor='#ffc840';
    tCtx.beginPath();tCtx.arc(x,y,r,0,Math.PI*2);tCtx.stroke();
    tCtx.shadowBlur=0;
    requestAnimationFrame(anim);
  };
  anim();
}
// 闪白
function flashWhite(intensity){
  const flash=document.createElement('div');
  flash.style.cssText=`position:fixed;inset:0;background:#fff;opacity:${intensity};z-index:40;pointer-events:none;transition:opacity .3s`;
  document.body.appendChild(flash);
  requestAnimationFrame(()=>{flash.style.opacity='0'});
  setTimeout(()=>flash.remove(),350);
}

/* ===== 音效 ===== */
let audioCtx;
function ensureAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)()}
function playExtinguishSound(){
  try{ensureAudio();
    // 弹指声
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type='triangle';o.frequency.setValueAtTime(1200,audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(300,audioCtx.currentTime+.1);
    g.gain.setValueAtTime(.15,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.12);
    o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.12);
  }catch(e){}
}
function playGuqin(){
  try{ensureAudio();
    // 古琴泛音
    [262,330,392,523,659].forEach((f,i)=>{
      setTimeout(()=>{
        const o=audioCtx.createOscillator(),g=audioCtx.createGain();
        o.type='sine';o.frequency.value=f;
        g.gain.setValueAtTime(.2,audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+1.2);
        o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+1.2);
      },i*200);
    });
  }catch(e){}
}

// 持续古琴背景音（五声音阶随机泛音）
let bgmPlaying=false;
function startBGM(){
  if(bgmPlaying)return;bgmPlaying=true;
  const scale=[131,147,165,196,220,262,294,330,392]; // 宫商角徵羽
  function playNote(){
    if(!bgmPlaying)return;
    try{
      ensureAudio();
      const f=scale[Math.floor(Math.random()*scale.length)]*(Math.random()<.3?2:1);
      const o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(0,audioCtx.currentTime);
      g.gain.linearRampToValueAtTime(.06,audioCtx.currentTime+.05);
      g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+2.5);
      o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+2.5);
    }catch(e){}
    setTimeout(playNote,800+Math.random()*1500);
  }
  // 首次交互后启动（浏览器自动播放策略）
  const start=()=>{startBGM._started||(startBGM._started=true,playNote());document.removeEventListener('click',start)};
  document.addEventListener('click',start);
}

/* ===== 烟花（剑气+孔明灯） ===== */
const canvas=document.getElementById('fw'),ctx=canvas.getContext('2d');
let particles=[];
function resize(){canvas.width=innerWidth;canvas.height=innerHeight}
resize();addEventListener('resize',resize);
const fwColors=['#ffd700','#ff6644','#ff8866','#cc9944','#ffaa66','#ffffff','#ffcc88'];
function spawnFirework(x,y,type){
  x=x||Math.random()*canvas.width;y=y||canvas.height*(0.15+Math.random()*0.35);
  const color=fwColors[Math.floor(Math.random()*fwColors.length)];
  if(type==='sword'){
    // 剑气烟花：放射状直线
    for(let i=0;i<24;i++){
      const angle=(Math.PI*2/24)*i;
      particles.push({x,y,vx:Math.cos(angle)*7,vy:Math.sin(angle)*7,life:1,color,size:2,gravity:.02,trail:true});
    }
  }else if(type==='lotus'){
    // 莲花形
    for(let i=0;i<60;i++){
      const angle=(Math.PI*2/60)*i;
      const r=2+Math.abs(Math.sin(angle*3))*3;
      particles.push({x,y,vx:Math.cos(angle)*r,vy:Math.sin(angle)*r,life:1,color,size:2.5,gravity:.03});
    }
  }else{
    const count=type==='big'?80:50;
    for(let i=0;i<count;i++){
      const angle=(Math.PI*2/count)*i;
      const speed=type==='big'?4+Math.random()*4:2.5+Math.random()*3;
      particles.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,life:1,color,size:type==='big'?3:2,gravity:.04});
    }
  }
}
function spawnSparks(x,y){
  for(let i=0;i<10;i++){
    particles.push({x,y,vx:(Math.random()-.5)*5,vy:-Math.random()*3-1,life:.7,color:'#ff6600',size:2+Math.random()*2,gravity:.08});
  }
}
function spawnLanterns(){
  for(let i=0;i<15;i++){
    setTimeout(()=>{
      const l=document.createElement('div');l.className='lantern';
      l.style.left=(10+Math.random()*80)+'%';
      l.style.bottom='-50px';
      l.style.animationDelay=(Math.random()*2)+'s';
      document.body.appendChild(l);
      requestAnimationFrame(()=>l.classList.add('rise'));
      setTimeout(()=>l.remove(),9000);
    },i*250);
  }
}
function finale(){
  // 全灭瞬间：强闪白+剧烈震动
  flashWhite(.35);
  document.body.classList.add('shake');
  setTimeout(()=>document.body.classList.remove('shake'),400);
  // 镜头拉远
  const wrapEl=document.getElementById('wrap');
  wrapEl.style.transition='transform 2.6s cubic-bezier(.2,.8,.2,1)';
  wrapEl.style.transform='scale(.86)';
  // 电影黑边 + 主界面文字淡出
  document.getElementById('cine').classList.add('on');
  wrapEl.classList.add('finale');
  // 「万剑归宗」标题一闪
  const st=document.getElementById('swordsTitle');
  setTimeout(()=>st.classList.add('on'),180);
  setTimeout(()=>st.classList.remove('on'),2800);
  // 显示结局
  setTimeout(()=>wishText.classList.add('show'),300);
  // 猫咪跳上蛋糕，然后望向月亮
  const cat=document.getElementById('cat');
  cat.classList.remove('wish');
  cat.style.transition='all .8s cubic-bezier(.3,1.5,.5,1)';
  cat.style.left='calc(50% - 35px)';
  cat.style.bottom='120px';
  cat.style.transform='scale(1.2)';
  setTimeout(()=>cat.classList.add('gaze-moon'),1000);
  // 画面恢复
  setTimeout(()=>{document.body.style.filter='brightness(1) saturate(1)'},500);
  playGuqin();
  // 万剑归宗（80道剑气汇聚）
  tenThousandSwords();
  // 1.2秒后中心大爆发 + 冲击波 + 烟花
  setTimeout(()=>{
    const cx=canvas.width/2, cy=canvas.height*0.55;
    // 中心冲击波（激活原本闲置的 spawnShockwave）
    for(let r=0;r<4;r++){
      setTimeout(()=>{
        spawnShockwave(cx,cy);
        for(let i=0;i<70;i++){
          const angle=(Math.PI*2/70)*i+Math.random()*.1;
          const speed=5+Math.random()*9;
          particles.push({x:cx,y:cy,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,
            life:1,color:Math.random()<.5?'#ffd700':'#ff6644',size:3+Math.random()*2,gravity:.01});
        }
      },r*180);
    }
    spawnLanterns();
    let n=0;
    const types=['sword','lotus','big','normal'];
    const iv=setInterval(()=>{
      spawnFirework(undefined,undefined,types[n%types.length]);
      if(n%2===0)spawnFirework(undefined,undefined,'normal');
      n++;
      if(n>18)clearInterval(iv);
    },200);
  },1200);
  // 盖印章 + 轻微震动
  setTimeout(()=>{
    document.getElementById('sealFinal').classList.add('stamp');
    flashWhite(.16);
    document.body.classList.add('shake');
    setTimeout(()=>document.body.classList.remove('shake'),260);
  },CONFIG.sealDelay);
  // 操作区 + 自动前往倒计时
  const startAt=performance.now();
  setTimeout(()=>{
    document.getElementById('finalActions').classList.add('on');
    const tip=document.getElementById('autoTip');
    (function tick(){
      const left=Math.max(0,Math.ceil((CONFIG.autoJumpDelay-(performance.now()-startAt))/1000));
      if(left<=0){tip.innerHTML='即将展开 <b>生辰信笺</b> …';return}
      tip.innerHTML='或将 '+left+' 秒后自动前往 <b>生辰信笺</b>';
      setTimeout(tick,250);
    })();
  },CONFIG.sealDelay+1200);
  // 自动跳转
  setTimeout(goNext,CONFIG.autoJumpDelay);
}

/* 前往下一页（按钮或自动） */
let jumping=false;
function goNext(){
  if(jumping||!CONFIG.nextPage)return;
  jumping=true;
  document.body.style.transition='opacity 1.4s';
  document.body.style.opacity='0';
  setTimeout(()=>location.href=CONFIG.nextPage,1400);
}
document.getElementById('goNext').addEventListener('click',goNext);
document.getElementById('goNext').textContent='展 开 信 笺 →';
document.getElementById('sealFinalText').textContent=(CONFIG.sealText||['岁','岁','平','安']).join('');
document.querySelector('.subtitle').textContent='一 香 一 愿 · 弹 指 即 灭';
document.querySelector('.title').textContent=CONFIG.warriorName+'许愿';

/* ===== 主循环 ===== */
function loop(){
  try{
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx;p.y+=p.vy;p.vy+=(p.gravity||.04);p.vx*=.99;p.life-=.01;
    if(p.life<=0){particles.splice(i,1);continue}
    ctx.globalAlpha=p.life;
    ctx.fillStyle=p.color;
    ctx.shadowBlur=10;ctx.shadowColor=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
    if(p.trail){
      ctx.globalAlpha=p.life*.3;
      ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*3,p.y-p.vy*3);
      ctx.lineWidth=1.5;ctx.strokeStyle=p.color;ctx.stroke();
    }
    ctx.shadowBlur=0;
  }
  ctx.globalAlpha=1;
  // 万剑归宗剑气
  const now=performance.now();
  for(let i=swords.length-1;i>=0;i--){
    const s=swords[i];
    if(now-s.startTime<s.delay)continue;
    if(s.arrived)continue;
    const dx=s.tx-s.x,dy=s.ty-s.y;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<15){s.arrived=true;continue}
    s.x+=dx/dist*s.speed;
    s.y+=dy/dist*s.speed;
    const ang=Math.atan2(dy,dx);
    const tailX=s.x-Math.cos(ang)*s.len;
    const tailY=s.y-Math.sin(ang)*s.len;
    const grad=ctx.createLinearGradient(tailX,tailY,s.x,s.y);
    grad.addColorStop(0,'rgba(255,215,0,0)');
    grad.addColorStop(.5,'rgba(255,200,80,.7)');
    grad.addColorStop(1,'rgba(255,255,255,1)');
    ctx.strokeStyle=grad;ctx.lineWidth=4;
    ctx.shadowBlur=25;ctx.shadowColor='#ffd700';
    ctx.beginPath();ctx.moveTo(tailX,tailY);ctx.lineTo(s.x,s.y);ctx.stroke();
    ctx.shadowBlur=0;
  }
  }catch(e){console.error('loop error:',e)}
  requestAnimationFrame(loop);
}
loop();

/* ===== 转场系统 ===== */
const tCanvas=document.getElementById('transition'),tCtx=tCanvas.getContext('2d');
function tResize(){tCanvas.width=innerWidth;tCanvas.height=innerHeight}
tResize();addEventListener('resize',tResize);
let tParticles=[],tActive=false,tCallback=null;

function tLoop(){
  if(!tActive){requestAnimationFrame(tLoop);return}
  tCtx.clearRect(0,0,tCanvas.width,tCanvas.height);
  let alive=false;
  for(let i=tParticles.length-1;i>=0;i--){
    const p=tParticles[i];
    p.x+=p.vx;p.y+=p.vy;p.vy+=(p.gravity||0);p.life-=p.decay||.015;
    if(p.life<=0){tParticles.splice(i,1);continue}
    alive=true;
    tCtx.globalAlpha=Math.max(0,p.life);
    if(p.type==='streak'){
      tCtx.strokeStyle=p.color;tCtx.lineWidth=p.size||3;
      tCtx.shadowBlur=20;tCtx.shadowColor=p.color;
      tCtx.beginPath();tCtx.moveTo(p.x,p.y);tCtx.lineTo(p.x-p.vx*4,p.y-p.vy*4);tCtx.stroke();
      tCtx.shadowBlur=0;
    }else if(p.type==='ring'){
      tCtx.strokeStyle=p.color;tCtx.lineWidth=p.size||4;
      tCtx.shadowBlur=30;tCtx.shadowColor=p.color;
      tCtx.beginPath();tCtx.arc(p.x,p.y,p.r,0,Math.PI*2);tCtx.stroke();
      tCtx.shadowBlur=0;p.r+=(p.maxR-p.r)*.08;
    }else{
      tCtx.fillStyle=p.color;
      tCtx.shadowBlur=15;tCtx.shadowColor=p.color;
      tCtx.beginPath();tCtx.arc(p.x,p.y,p.size,0,Math.PI*2);tCtx.fill();
      tCtx.shadowBlur=0;
    }
  }
  tCtx.globalAlpha=1;
  if(!alive&&tParticles.length===0){
    tActive=false;
    tCanvas.classList.remove('active');
    if(tCallback){const cb=tCallback;tCallback=null;setTimeout(cb,100)}
  }
  requestAnimationFrame(tLoop);
}
tLoop();

// 入场：剑气横扫
function transitionSwordIn(cb){
  tActive=true;tCanvas.classList.add('active');tCallback=cb;
  tParticles=[];
  const cx=tCanvas.width/2,cy=tCanvas.height/2;
  // 黑色遮罩先覆盖
  tCtx.fillStyle='#050302';tCtx.fillRect(0,0,tCanvas.width,tCanvas.height);
  // 剑气从左到右
  let slashX=-100;
  const slashAnim=()=>{
    if(slashX>tCanvas.width+200){
      // 剑气过后清除遮罩，留粒子
      tCtx.clearRect(0,0,tCanvas.width,tCanvas.height);
      for(let i=0;i<60;i++){
        tParticles.push({x:slashX,y:cy+(Math.random()-.5)*tCanvas.height*.6,
          vx:-3-Math.random()*5,vy:(Math.random()-.5)*2,life:1,decay:.02,
          color:Math.random()<.5?'#ffd700':'#ff8844',size:2+Math.random()*3,type:'dot'});
      }
      return;
    }
    slashX+=40;
    // 绘制剑气
    tCtx.fillStyle='#050302';
    tCtx.fillRect(slashX,0,tCanvas.width-slashX,tCanvas.height);
    // 剑气边缘光
    const grad=tCtx.createLinearGradient(slashX-80,0,slashX+20,0);
    grad.addColorStop(0,'rgba(255,215,0,0)');
    grad.addColorStop(.6,'rgba(255,180,60,.6)');
    grad.addColorStop(1,'rgba(255,255,255,.9)');
    tCtx.fillStyle=grad;
    tCtx.fillRect(slashX-80,0,100,tCanvas.height);
    // 剑气主线
    tCtx.strokeStyle='#fff';tCtx.lineWidth=3;
    tCtx.shadowBlur=30;tCtx.shadowColor='#ffd700';
    tCtx.beginPath();tCtx.moveTo(slashX,0);tCtx.lineTo(slashX,tCanvas.height);tCtx.stroke();
    tCtx.shadowBlur=0;
    // 飞溅粒子
    for(let i=0;i<3;i++){
      tParticles.push({x:slashX,y:Math.random()*tCanvas.height,
        vx:-5-Math.random()*8,vy:(Math.random()-.5)*4,life:1,decay:.025,
        color:'#ffd700',size:1+Math.random()*2,type:'dot'});
    }
    requestAnimationFrame(slashAnim);
  };
  slashAnim();
  // 剑鸣声
  try{
    ensureAudio();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type='sawtooth';o.frequency.setValueAtTime(800,audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(200,audioCtx.currentTime+.4);
    g.gain.setValueAtTime(.15,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.5);
    o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.5);
  }catch(e){}
}

// 万剑归宗：无数剑气从四面八方飞向中心（用fw canvas渲染）
let swords=[];
function tenThousandSwords(cb){
  const cx=canvas.width/2,cy=canvas.height/2;
  swords=[];
  const total=80;
  for(let i=0;i<total;i++){
    const angle=Math.random()*Math.PI*2;
    const dist=Math.max(canvas.width,canvas.height)*.7;
    swords.push({
      x:cx+Math.cos(angle)*dist,
      y:cy+Math.sin(angle)*dist,
      tx:cx,ty:cy,
      speed:14+Math.random()*10,
      len:35+Math.random()*45,
      delay:i*18,
      startTime:performance.now(),
      arrived:false
    });
  }
  // 轮询等待全部到达
  const check=setInterval(()=>{
    if(swords.every(s=>s.arrived)){
      clearInterval(check);
      swords=[];
      if(cb)cb();
    }
  },50);
  // 剑鸣音效
  try{
    ensureAudio();
    for(let i=0;i<6;i++){
      setTimeout(()=>{
        const o=audioCtx.createOscillator(),g=audioCtx.createGain();
        o.type='sawtooth';o.frequency.setValueAtTime(1200+Math.random()*600,audioCtx.currentTime);
        o.frequency.exponentialRampToValueAtTime(250,audioCtx.currentTime+.18);
        g.gain.setValueAtTime(.07,audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.22);
        o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.22);
      },i*60);
    }
  }catch(e){}
}

// 结局：金光爆发
function transitionGoldBurst(cb){
  tActive=true;tCanvas.classList.add('active');tCallback=cb;
  tParticles=[];
  const cx=tCanvas.width/2,cy=tCanvas.height/2;
  // 中心光环
  tParticles.push({x:cx,y:cy,r:10,maxR:Math.max(tCanvas.width,tCanvas.height)*.7,
    life:1,decay:.012,color:'#ffd700',size:6,type:'ring'});
  tParticles.push({x:cx,y:cy,r:5,maxR:Math.max(tCanvas.width,tCanvas.height)*.5,
    life:1,decay:.015,color:'#ff8844',size:4,type:'ring'});
  // 放射粒子
  for(let i=0;i<120;i++){
    const angle=(Math.PI*2/120)*i;
    const speed=6+Math.random()*10;
    tParticles.push({x:cx,y:cy,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,
      life:1,decay:.008,color:Math.random()<.6?'#ffd700':'#ff8844',
      size:2+Math.random()*3,type:'streak'});
  }
  // 金色闪光
  try{
    ensureAudio();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type='sine';o.frequency.setValueAtTime(523,audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(1047,audioCtx.currentTime+.3);
    g.gain.setValueAtTime(.2,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.6);
    o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.6);
  }catch(e){}
}

// 金光双向转场：铺满→回调→退去（独立运行，不经过tLoop）
function transitionGoldWipe(cb){
  tCanvas.classList.add('active');
  tParticles=[];
  let phase='in',wipeX=-100;
  const wipeAnim=()=>{
    if(phase==='in'){
      wipeX+=40;
      tCtx.fillStyle='rgba(255,200,80,.04)';
      tCtx.fillRect(0,0,tCanvas.width,tCanvas.height);
      const grad=tCtx.createLinearGradient(wipeX-150,0,wipeX+50,0);
      grad.addColorStop(0,'rgba(255,180,40,0)');
      grad.addColorStop(.5,'rgba(255,200,80,.85)');
      grad.addColorStop(1,'rgba(255,240,200,1)');
      tCtx.fillStyle=grad;
      tCtx.fillRect(wipeX-150,0,200,tCanvas.height);
      // 已铺满部分保持金色
      tCtx.fillStyle='rgba(255,220,140,.95)';
      tCtx.fillRect(0,0,wipeX-50,tCanvas.height);
      for(let i=0;i<4;i++){
        tParticles.push({x:wipeX,y:Math.random()*tCanvas.height,
          vx:2+Math.random()*4,vy:(Math.random()-.5)*3,life:1,decay:.02,
          color:'#ffd700',size:1+Math.random()*2,type:'dot'});
      }
      if(wipeX>=tCanvas.width+50){
        phase='hold';
        if(cb)cb();
        setTimeout(()=>{phase='out';wipeX=tCanvas.width+100},200);
      }
    }else if(phase==='out'){
      wipeX-=40;
      tCtx.clearRect(0,0,tCanvas.width,tCanvas.height);
      const grad=tCtx.createLinearGradient(wipeX-50,0,wipeX+150,0);
      grad.addColorStop(0,'rgba(255,240,200,1)');
      grad.addColorStop(.5,'rgba(255,200,80,.85)');
      grad.addColorStop(1,'rgba(255,180,40,0)');
      tCtx.fillStyle=grad;
      tCtx.fillRect(wipeX-50,0,200,tCanvas.height);
      tCtx.fillStyle='rgba(255,220,140,.95)';
      tCtx.fillRect(wipeX+50,0,tCanvas.width-wipeX,tCanvas.height);
      if(wipeX<=-150){
        tCanvas.classList.remove('active');
        tCtx.clearRect(0,0,tCanvas.width,tCanvas.height);
        return;
      }
    }
    requestAnimationFrame(wipeAnim);
  };
  wipeAnim();
  try{
    ensureAudio();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type='sine';o.frequency.setValueAtTime(440,audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(880,audioCtx.currentTime+.3);
    g.gain.setValueAtTime(.1,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.4);
    o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.4);
  }catch(e){}
}
