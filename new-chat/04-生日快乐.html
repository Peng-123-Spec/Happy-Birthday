<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>第四幕 · 生辰贺辞</title>
<link rel="stylesheet" href="共享/墨韵.css">
<script src="配置.js"></script>
<script src="共享/墨韵.js"></script>
<style>
/* ============================================================================
   第四幕 · 生辰贺辞 —— 立轴卷轴缓缓展开，写满四个字
   背景层 / 粒子 / 音效 / 转场全部来自「共享/墨韵」；本页只负责卷轴的排版。
   ============================================================================ */

#stage{position:fixed;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;
  padding:3vh 0 10vh;perspective:1400px}

.scroll{position:relative;width:clamp(286px,30vw,448px);height:min(74vh,690px);
  transform:translateZ(0);animation:scrollIn 1.4s cubic-bezier(.2,.8,.25,1) both}
@keyframes scrollIn{from{opacity:0;transform:translateY(26px) scale(.96)}to{opacity:1;transform:none}}

.rod{position:absolute;left:-17px;right:-17px;height:22px;border-radius:11px;z-index:3;
  background:linear-gradient(180deg,#544127,#2b2116 42%,#63503a 78%,#20180f);
  box-shadow:0 7px 20px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,225,170,.25)}
.rod::before,.rod::after{content:"";position:absolute;top:-5px;bottom:-5px;width:15px;border-radius:7px;
  background:linear-gradient(180deg,#f0d494,#b08c45 55%,#7d5f2a);
  box-shadow:0 0 14px rgba(232,200,135,.55), inset 0 1px 0 rgba(255,255,255,.5)}
.rod::before{left:-9px}
.rod::after{right:-9px}
.rod.top{top:-11px}
.rod.bottom{top:0;margin-top:-11px;transition:top 1.05s cubic-bezier(.24,.92,.24,1)}
.scroll.open .rod.bottom{top:100%}

.paper{position:absolute;inset:0;z-index:2;border-radius:2px;
  clip-path:inset(0 0 100% 0);
  transition:clip-path 1.05s cubic-bezier(.24,.92,.24,1);
  background:
    radial-gradient(120% 55% at 50% 0%, #fdf8ea, rgba(253,248,234,0) 62%),
    linear-gradient(180deg,#f8f1df,#f0e6cf 42%,#eadcbf 76%,#e2d2b2);
  box-shadow:inset 0 0 70px rgba(122,96,54,.28), inset 0 0 3px rgba(255,255,255,.6),
             0 26px 64px rgba(0,0,0,.62), 0 0 0 1px rgba(120,95,55,.35)}
.paper::before{content:"";position:absolute;inset:0;opacity:.5;pointer-events:none;
  background-image:
    repeating-linear-gradient(90deg, rgba(150,124,84,.09) 0 1px, transparent 1px 7px),
    repeating-linear-gradient(0deg, rgba(150,124,84,.06) 0 1px, transparent 1px 11px)}
.paper::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(78% 46% at 18% 14%, rgba(196,170,124,.40), transparent 62%),
    radial-gradient(66% 40% at 86% 88%, rgba(176,150,104,.38), transparent 62%),
    radial-gradient(40% 24% at 62% 50%, rgba(255,255,255,.35), transparent 70%)}
.scroll.open .paper{clip-path:inset(0 0 0 0)}

.frame{position:absolute;inset:13px;border:1px solid rgba(146,116,66,.5);pointer-events:none;z-index:1}
.frame::before{content:"";position:absolute;inset:4px;border:1px solid rgba(146,116,66,.28)}

.inner{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1.6vh;padding:7% 9% 12%}

.kicker{font-size:clamp(11px,1.75vh,15px);letter-spacing:.52em;text-indent:.52em;color:#7d6c4c;
  opacity:0;transform:translateY(-7px)}
.kicker.on{animation:inkLineIn .95s cubic-bezier(.2,.8,.25,1) forwards}

.hero{display:flex;flex-direction:column;align-items:center;margin:1.2vh 0 .4vh}
.char{position:relative;z-index:0;font-size:clamp(40px,7.1vh,74px);line-height:1.04;color:#241d13;
  opacity:0;clip-path:inset(0 0 100% 0);filter:blur(11px);will-change:clip-path,filter,opacity}
.char::before{content:"";position:absolute;inset:-16% -24%;border-radius:50%;z-index:-1;opacity:0;
  background:radial-gradient(closest-side, rgba(44,36,24,.26), rgba(44,36,24,.07) 58%, transparent 74%)}
.char.on{animation:brushIn .98s cubic-bezier(.2,.86,.24,1) forwards}
.char.on::before{animation:inkSpread 1.15s ease-out forwards}
@keyframes brushIn{
  0%{opacity:0;clip-path:inset(0 0 100% 0);filter:blur(13px)}
  16%{opacity:1;filter:blur(9px)}
  72%{clip-path:inset(0 0 0 0);filter:blur(1.6px)}
  100%{opacity:1;clip-path:inset(0 0 0 0);filter:blur(0)}
}
@keyframes inkSpread{0%{opacity:0;transform:scale(.38)}42%{opacity:1}100%{opacity:.6;transform:scale(1.02)}}

.hero.gold .char{
  background:linear-gradient(178deg,#fff6d2,#f0c465 38%,#a97c26 72%,#ffe7ab);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 22px rgba(255,214,130,.9)) drop-shadow(0 0 56px rgba(255,176,52,.6));
  transition:filter .55s ease}
.hero.gold .char::before{background:radial-gradient(closest-side, rgba(255,206,110,.55), transparent 72%);opacity:.85}

.sign{margin-top:.9vh;font-size:clamp(11px,1.65vh,14px);letter-spacing:.34em;text-indent:.34em;color:#8b7850;
  opacity:0;transform:translateY(7px)}
.sign.on{animation:inkLineIn 1s cubic-bezier(.2,.8,.25,1) forwards}

.blessing{margin-top:1.9vh;display:flex;flex-direction:column;gap:.72em;text-align:center}
.blessing p{font-size:clamp(12px,1.95vh,16px);color:#4b3f2c;letter-spacing:.2em;text-indent:.2em;
  opacity:0;transform:translateY(9px);filter:blur(4px)}
.blessing.on p{animation:inkLineIn .9s cubic-bezier(.2,.8,.25,1) forwards}
.blessing.on p:nth-child(1){animation-delay:.02s}
.blessing.on p:nth-child(2){animation-delay:.24s}
.blessing.on p:nth-child(3){animation-delay:.46s}

.seal{position:absolute;right:6.5%;bottom:4.5%;z-index:5;width:clamp(42px,5.9vh,58px);aspect-ratio:1;
  grid-template-columns:1fr 1fr;font-size:clamp(14px,2vh,20px);
  opacity:0;transform:scale(2.7) rotate(-17deg)}
.seal.on{animation:stampIn .52s cubic-bezier(.2,1.55,.4,1) forwards}
@keyframes stampIn{
  0%{opacity:0;transform:scale(2.7) rotate(-17deg)}
  58%{opacity:1;transform:scale(.9) rotate(-5deg)}
  100%{opacity:.93;transform:scale(1) rotate(-4.5deg)}
}

/* 控件 */
#controls{position:fixed;left:0;right:0;bottom:5.2vh;z-index:15;display:flex;gap:14px;
  justify-content:center;flex-wrap:wrap;opacity:0;transform:translateY(14px);
  pointer-events:none;transition:opacity .9s ease,transform .9s cubic-bezier(.2,.8,.25,1)}
#controls.on{opacity:1;transform:none;pointer-events:auto}
#btnNext{background:linear-gradient(180deg,#fff6d8,#e8c887 46%,#d6b463);color:#2a2115;
  font-weight:600;letter-spacing:.22em;
  box-shadow:0 0 30px rgba(232,200,135,.45),0 8px 22px rgba(0,0,0,.5)}

#cd{position:fixed;left:0;right:0;bottom:13.2vh;z-index:15;text-align:center;pointer-events:none;
  font-size:12px;letter-spacing:.2em;color:rgba(232,200,135,.62);opacity:0;transition:opacity 1s ease}
#cd.on{opacity:1}
#cd b{color:#ffd98a}

@media (max-width:520px){
  #stage{padding:2vh 0 13vh}
  .scroll{width:78vw}
}
</style>
</head>
<body>

<div id="stage">
  <div class="scroll" id="scroll">
    <div class="rod top"></div>
    <div class="paper">
      <div class="frame"></div>
      <div class="inner">
        <div class="kicker" id="kicker"></div>
        <div class="hero" id="hero"></div>
        <div class="sign" id="sign"></div>
        <div class="blessing" id="blessing"></div>
      </div>
      <div class="seal seal-cn" id="seal"></div>
    </div>
    <div class="rod bottom"></div>
  </div>
</div>

<div id="controls">
  <button class="btn-gold" id="btnNext">展 开 真 心 话</button>
  <button class="btn-gold" id="btnReplay">重 看 一 遍</button>
  <button class="btn-gold" id="btnBack">回 到 江 湖</button>
</div>
<div id="cd"></div>

<script>
(function(){
  "use strict";

  /* ================= 文案来自「配置.js」的 SITE ================= */
  var S = window.SITE || {};
  var CONFIG = {
    kicker:    "第四幕 · 生辰贺辞",
    heroChars: S.heroChars  || ["生","日","快","乐"],
    signature: S.signature  || "剑心为贺 · 与君同赴此江湖",
    blessing:  S.blessing   || ["愿你遍历山河，仍觉人间值得",
                                "愿你剑心通明，所行皆作坦途",
                                "愿你岁岁长安，常乐无忧"],
    sealChars: S.sealChars  || ["岁","岁","平","安"],
    nextUrl:   "./05-真心话.html",
    backUrl:   S.backUrl    || "./index.html",
    autoNext:  18000
  };

  var $ = Ink.$;
  var scrollEl=$("scroll"), heroEl=$("hero"), sealEl=$("seal"),
      kickerEl=$("kicker"), signEl=$("sign"), blessEl=$("blessing"),
      ctrlEl=$("controls"), cdEl=$("cd"), stageEl=$("stage");

  /* ---------- 内容注入 ---------- */
  kickerEl.textContent = CONFIG.kicker;
  signEl.textContent   = CONFIG.signature;
  var chars=[], i;
  for(i=0;i<CONFIG.heroChars.length;i++){
    var c=document.createElement("span");
    c.className="char"; c.textContent=CONFIG.heroChars[i];
    heroEl.appendChild(c); chars.push(c);
  }
  for(i=0;i<CONFIG.blessing.length;i++){
    var p=document.createElement("p");
    p.textContent=CONFIG.blessing[i]; blessEl.appendChild(p);
  }
  for(i=0;i<CONFIG.sealChars.length;i++){
    var s=document.createElement("span");
    s.textContent=CONFIG.sealChars[i]; sealEl.appendChild(s);
  }

  /* ================= 演出 ================= */
  var CHARS=chars.length, T_START=4300, nextTimer=null;

  function playShow(){
    Ink.reveal();
    setTimeout(function(){ scrollEl.classList.add("open"); },480);
    setTimeout(function(){ kickerEl.classList.add("on"); },1180);
    for(var k=0;k<CHARS;k++){
      (function(k){
        setTimeout(function(){
          chars[k].classList.add("on");
          Ink.bell([523.25,587.33,659.25,783.99][k%4],1.0,0.055);
        },1720+k*520);
      })(k);
    }
    setTimeout(function(){ signEl.classList.add("on"); },1720+CHARS*520-140);
    setTimeout(climax, T_START);
  }

  function climax(){
    var r=scrollEl.getBoundingClientRect();
    var cx=r.left+r.width/2, cy=r.top+r.height/2;

    Ink.flash(0.88,780);
    Ink.shake(700, stageEl);
    Ink.whoosh();
    Ink.FX.shockwave(cx,cy,[255,232,180]);
    Ink.FX.swords(cx,cy,64);
    heroEl.classList.add("gold");
    Ink.FX.barrage(11);

    setTimeout(function(){ heroEl.classList.remove("gold"); }, 1700);

    setTimeout(function(){
      sealEl.classList.add("on");
      Ink.shake(430, stageEl);
      Ink.bell(392,0.5,0.1);
      Ink.FX.shockwave(cx,cy,[230,120,100]);
      var sr=sealEl.getBoundingClientRect();
      Ink.FX.sparks(sr.left+sr.width/2, sr.top+sr.height/2, 0, 26, 1.6);
    },880);

    setTimeout(function(){ blessEl.classList.add("on"); Ink.bell(659.25,1.6,0.06); },1420);
    setTimeout(function(){ for(var k=0;k<7;k++) Ink.FX.lantern(); },1800);
    setTimeout(function(){ ctrlEl.classList.add("on"); },2400);
    setTimeout(function(){
      ctrlEl.querySelector("#btnNext").focus();
      cdEl.classList.add("on");
      startCountdown();
    },2500);
    setTimeout(function(){
      setInterval(function(){
        if(document.hidden) return;
        Ink.FX.firework(Ink.rand(innerWidth*0.06,innerWidth*0.94), Ink.rand(innerHeight*0.06,innerHeight*0.5));
      },2100);
      setInterval(function(){ if(!document.hidden) Ink.FX.lantern(); },3200);
      setInterval(function(){ if(!document.hidden) Ink.FX.slash(); },2600);
    },2600);
  }

  function startCountdown(){
    var left=Math.round(CONFIG.autoNext/1000);
    var tick=function(){
      if(left<=0){ cdEl.innerHTML="即将展开 <b>真心话</b> …"; return; }
      cdEl.innerHTML = left + " 秒后自动展开 <b>真心话</b> · 或点击下方按钮";
      left--;
    };
    tick();
    nextTimer = setInterval(tick,1000);
    nextTimer2 = setTimeout(function(){ goNext(); }, CONFIG.autoNext);
  }
  var nextTimer2=null;

  function goNext(){
    if(nextTimer) clearInterval(nextTimer);
    if(nextTimer2) clearTimeout(nextTimer2);
    Ink.go(CONFIG.nextUrl);
  }

  /* ================= 交互 ================= */
  document.addEventListener("pointerdown",function(e){
    if(e.target && e.target.closest && e.target.closest("button")) return;
    Ink.FX.firework(e.clientX,e.clientY);
    Ink.FX.sparks(e.clientX,e.clientY,(Math.random()*6)|0,18,1.3);
    Ink.bell(Ink.rand(600,1000),0.35,0.03);
  });

  $("btnNext").addEventListener("click", goNext);
  $("btnReplay").addEventListener("click", function(){ location.reload(); });
  $("btnBack").addEventListener("click", function(){ Ink.go(CONFIG.backUrl); });

  document.addEventListener("keydown",function(e){
    if(e.key==="r"||e.key==="R") location.reload();
    if(e.key==="Escape"){ ctrlEl.classList.toggle("on"); }
  });

  /* ================= 启动 ================= */
  Ink.FX.start();
  Ink.controls({ hint:"轻 点 任 意 处 · 剑 绽 烟 花", hintDelay:2600 });
  playShow();
})();
</script>
</body>
</html>
