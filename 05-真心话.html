<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>终章 · 见字如面</title>
<link rel="stylesheet" href="共享/墨韵.css">
<script src="配置.js"></script>
<script src="共享/墨韵.js"></script>
<style>
/* ============================================================================
   第五幕 · 见字如面 —— 摊开一张信笺，把想说的话一句一句写给她
   你要改的内容在「配置.js」里的 truelove，不用动这个文件。
   ============================================================================ */

#stage{position:fixed;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;
  padding:1.5vh 0 14vh}

.letter{position:relative;width:clamp(300px,66vw,780px);height:min(70vh,660px);
  transform:translateZ(0);animation:letterIn 1.5s cubic-bezier(.2,.8,.25,1) both}
@keyframes letterIn{from{opacity:0;transform:translateY(28px) scale(.97)}to{opacity:1;transform:none}}

/* 木轴 */
.rod{position:absolute;left:-18px;right:-18px;height:22px;border-radius:11px;z-index:3;
  background:linear-gradient(180deg,#544127,#2b2116 42%,#63503a 78%,#20180f);
  box-shadow:0 7px 20px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,225,170,.25)}
.rod::before,.rod::after{content:"";position:absolute;top:-5px;bottom:-5px;width:15px;border-radius:7px;
  background:linear-gradient(180deg,#f0d494,#b08c45 55%,#7d5f2a);
  box-shadow:0 0 14px rgba(232,200,135,.55), inset 0 1px 0 rgba(255,255,255,.5)}
.rod::before{left:-9px}
.rod::after{right:-9px}
.rod.top{top:-11px}
.rod.bottom{top:0;margin-top:-11px;transition:top 1.15s cubic-bezier(.24,.92,.24,1)}
.letter.open .rod.bottom{top:100%}

/* 宣纸 */
.paper{position:absolute;inset:0;z-index:2;
  clip-path:inset(0 0 100% 0);
  transition:clip-path 1.15s cubic-bezier(.24,.92,.24,1);
  background:
    radial-gradient(120% 55% at 50% 0%, #fdf8ea, rgba(253,248,234,0) 62%),
    linear-gradient(180deg,#f9f2e1,#f1e7d0 44%,#ebddc1 78%,#e3d3b3);
  box-shadow:inset 0 0 80px rgba(122,96,54,.30), inset 0 0 3px rgba(255,255,255,.6),
             0 26px 64px rgba(0,0,0,.62), 0 0 0 1px rgba(120,95,55,.35)}
.paper::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;z-index:0;
  background-image:
    repeating-linear-gradient(90deg, rgba(150,124,84,.075) 0 1px, transparent 1px 7px),
    repeating-linear-gradient(0deg, rgba(150,124,84,.05) 0 1px, transparent 1px 11px)}
/* 朱丝栏 */
.paper::after{content:"";position:absolute;inset:14px;pointer-events:none;z-index:0;opacity:.55;
  background:
    repeating-linear-gradient(90deg, rgba(178,58,47,.085) 0 1px, transparent 1px 2.7em),
    radial-gradient(78% 46% at 16% 10%, rgba(196,170,124,.34), transparent 62%),
    radial-gradient(66% 42% at 88% 92%, rgba(176,150,104,.32), transparent 62%)}
.letter.open .paper{clip-path:inset(0 0 0 0)}

/* 双线朱框 */
.frame{position:absolute;inset:11px;z-index:1;pointer-events:none;border:1px solid rgba(146,116,66,.5)}
.frame::before{content:"";position:absolute;inset:4px;border:1px solid rgba(146,116,66,.26)}

/* 水印 */
.watermark{position:absolute;left:50%;top:50%;z-index:0;pointer-events:none;
  transform:translate(-50%,-50%);line-height:1;
  font-size:min(44vh,300px);color:rgba(120,95,55,.06)}

/* 正文区 */
#content{position:absolute;inset:0;z-index:2;overflow-y:auto;overscroll-behavior:contain;
  padding:6.5% 8.5% 8%;display:flex;flex-direction:column;scrollbar-width:none}
#content::-webkit-scrollbar{width:0;height:0}

.topline{font-size:clamp(16px,2.5vh,22px);color:#3a2f20;letter-spacing:.28em;
  padding-bottom:.7em;margin-bottom:.5em;border-bottom:1px solid rgba(146,116,66,.3);
  opacity:0;transform:translateY(-8px)}
.topline.on{animation:inkLineIn .95s cubic-bezier(.2,.8,.25,1) forwards}

.body p{font-size:clamp(15px,2.1vh,19px);line-height:2.05;color:#2c2318;
  letter-spacing:.035em;text-indent:2em;margin:0 0 .5em;word-break:break-word}
.body p.blank{height:.6em;margin:0}

.ch{opacity:0;filter:blur(6px);display:inline}
.ch.on{animation:chIn .46s cubic-bezier(.2,.8,.25,1) forwards}
@keyframes chIn{from{opacity:0;filter:blur(6px)}to{opacity:1;filter:blur(0)}}

.foot{margin-top:auto;padding-top:2.2em;text-align:right;opacity:0;transform:translateY(10px)}
.foot.on{animation:inkLineIn 1.1s cubic-bezier(.2,.8,.25,1) forwards}
.sign{font-size:clamp(14px,2vh,18px);color:#3a2f20;letter-spacing:.16em}
.date{margin-top:.6em;font-size:clamp(11px,1.55vh,13px);color:#7d6c4c;letter-spacing:.22em}

/* 印章（跟在落款下面，右对齐） */
.sealrow{display:flex;justify-content:flex-end;padding-right:2.5%;margin-top:1em}
#seal{width:clamp(50px,7vh,68px);aspect-ratio:1;
  position:relative;z-index:5;
  grid-template-columns:1fr 1fr;font-size:clamp(15px,2.2vh,21px);
  opacity:0;transform:scale(2.7) rotate(-17deg)}
#seal.on{animation:stampIn .52s cubic-bezier(.2,1.55,.4,1) forwards}
@keyframes stampIn{
  0%{opacity:0;transform:scale(2.7) rotate(-17deg)}
  58%{opacity:1;transform:scale(.9) rotate(-5deg)}
  100%{opacity:.93;transform:scale(1) rotate(-4.5deg)}}

/* 全剧终 */
#endline{position:fixed;left:0;right:0;bottom:11.6vh;z-index:14;text-align:center;pointer-events:none;
  font-size:clamp(12px,1.7vh,15px);letter-spacing:.62em;text-indent:.62em;
  color:rgba(232,200,135,.0);transition:color 1.6s ease}
#endline.on{color:rgba(232,200,135,.72)}

/* 控制条 */
#controls{position:fixed;left:0;right:0;bottom:5vh;z-index:15;display:flex;gap:14px;
  justify-content:center;flex-wrap:wrap;opacity:0;transform:translateY(14px);
  pointer-events:none;transition:opacity .9s ease,transform .9s cubic-bezier(.2,.8,.25,1)}
#controls.on{opacity:1;transform:none;pointer-events:auto}

/* 「还没写真心话」提示 */
#editHint{position:fixed;left:50%;top:2.4vh;z-index:16;transform:translateX(-50%) translateY(-10px);
  max-width:min(92vw,720px);padding:10px 18px;border-radius:10px;
  background:rgba(40,26,12,.82);border:1px solid rgba(232,200,135,.5);
  color:#ffd98a;font-size:12.5px;line-height:1.7;letter-spacing:.06em;text-align:center;
  opacity:0;pointer-events:none;transition:opacity .8s ease,transform .8s ease}
#editHint.on{opacity:1;transform:translateX(-50%) translateY(0)}
#editHint b{color:#fff3cf}

@media (max-width:640px){
  .letter{width:88vw;height:min(66vh,560px)}
  #content{padding:7% 7% 9%}
  #endline{bottom:13vh;letter-spacing:.4em;text-indent:.4em}
}
</style>
</head>
<body>

<div id="stage">
  <div class="letter" id="letter">
    <div class="rod top"></div>
    <div class="paper">
      <div class="frame"></div>
      <div class="watermark">心</div>
      <div id="content">
        <div class="topline" id="topline"></div>
        <div class="body" id="body"></div>
        <div class="foot" id="foot">
          <div class="sign" id="sign"></div>
          <div class="date" id="date"></div>
        </div>
        <div class="sealrow"><div class="seal-cn" id="seal"></div></div>
      </div>
    </div>
    <div class="rod bottom"></div>
  </div>
</div>

<div id="endline">剑 影 江 湖 · 全 剧 终</div>

<div id="editHint"></div>

<div id="controls">
  <button class="btn-gold" id="btnAgain">再 读 一 遍</button>
  <button class="btn-gold" id="btnHome">回 到 开 头</button>
</div>

<script>
(function(){
  "use strict";

  /* ---------------- 读取「配置.js」里的真心话 ---------------- */
  var T = (window.SITE && window.SITE.truelove) || {};
  var topline = T.topline || "致 你";
  var words   = (T.words && T.words.length) ? T.words : ["……（还没有写下真心话）"];
  var sign    = T.sign || "";
  var date    = T.date || "";
  var sealTxt = ["见","字","如","面"];
  var honor   = (window.SITE && window.SITE.honorific) || "你";

  var $ = Ink.$;
  var letterEl = $("letter"), contentEl = $("content"), bodyEl = $("body"),
      footEl = $("foot"), sealEl = $("seal"), stageEl = $("stage");

  /* ---------------- 注入内容 ---------------- */
  $("topline").textContent = topline;
  $("sign").textContent    = sign;
  $("date").textContent    = date;
  for(var s=0;s<sealTxt.length;s++){
    var sp = document.createElement("span");
    sp.textContent = sealTxt[s];
    sealEl.appendChild(sp);
  }

  var paras = [], k;
  for(k=0;k<words.length;k++){
    var txt = (words[k]===undefined || words[k]===null) ? "" : String(words[k]);
    var p = document.createElement("p");
    if(txt.replace(/\s/g,"") === ""){
      p.className = "blank";
    }else{
      var cs = Array.prototype.slice.call(txt);
      for(var j=0;j<cs.length;j++){
        var ch = document.createElement("span");
        ch.className = "ch";
        ch.textContent = cs[j];
        p.appendChild(ch);
      }
    }
    bodyEl.appendChild(p);
    paras.push(p);
  }

  /* ---------------- 排出「逐字书写」时间轴 ---------------- */
  var schedule = [], clock = 0;
  var totalChars = bodyEl.querySelectorAll(".ch").length;
  var CH = 46;
  if(totalChars > 0 && totalChars * CH > 24000){ CH = Math.max(15, Math.round(24000/totalChars)); }
  for(k=0;k<paras.length;k++){
    var list = paras[k].querySelectorAll(".ch");
    if(!list.length){ clock += 760; continue; }
    for(var n=0;n<list.length;n++){ schedule.push({el:list[n], t:clock}); clock += CH; }
    clock += 720;
  }
  var WRITE_TOTAL = clock;

  /* ---------------- 书写动画 ---------------- */
  function autoScroll(el){
    var r = el.getBoundingClientRect(), c = contentEl.getBoundingClientRect();
    if(r.bottom > c.bottom - 30){
      contentEl.scrollTop += (r.bottom - c.bottom) + 56;
    }
  }

  var started = false;
  function startWriting(){
    if(started) return; started = true;
    var t0 = null, cursor = 0;
    function frame(now){
      if(t0 === null) t0 = now;
      var el = now - t0;
      while(cursor < schedule.length && schedule[cursor].t <= el){
        var it = schedule[cursor];
        it.el.classList.add("on");
        if(cursor % 3 === 0) Ink.bell(Ink.rand(560,900), 0.10, 0.009);
        autoScroll(it.el);
        cursor++;
      }
      if(cursor < schedule.length) requestAnimationFrame(frame);
      else setTimeout(finishWriting, 900);
    }
    requestAnimationFrame(frame);
  }

  /* ---------------- 写完：落款 + 印章 ---------------- */
  var finished = false;
  function finishWriting(){
    if(finished) return; finished = true;
    contentEl.scrollTop = contentEl.scrollHeight;
    footEl.classList.add("on");
    Ink.bell(392, 1.5, 0.06);

    setTimeout(function(){
      sealEl.classList.add("on");
      Ink.shake(430);
      Ink.bell(523.25, 0.5, 0.095);
      var r = sealEl.getBoundingClientRect();
      Ink.FX.sparks(r.left + r.width/2, r.top + r.height/2, 0, 28, 1.7);
    }, 950);

    setTimeout(climax, 1600);
  }

  /* ---------------- 高潮：万剑归宗 + 烟花 ---------------- */
  var climaxed = false;
  function climax(){
    if(climaxed) return; climaxed = true;
    Ink.flash(0.86, 800);
    Ink.shake(720);
    Ink.whoosh();
    Ink.cine(true);
    Ink.FX.shockwave(innerWidth/2, innerHeight/2);
    Ink.FX.swords(innerWidth/2, innerHeight/2, 56);
    Ink.FX.barrage(10);

    setTimeout(function(){ Ink.FX.lanterns(9); }, 900);
    setTimeout(function(){ $("endline").classList.add("on"); Ink.bell(659.25, 2.0, 0.05); }, 1700);
    setTimeout(function(){ $("controls").classList.add("on"); }, 2700);
    setTimeout(function(){
      setInterval(function(){ if(!document.hidden) Ink.FX.firework(Ink.rand(innerWidth*0.06, innerWidth*0.94), Ink.rand(innerHeight*0.06, innerHeight*0.5)); }, 2100);
      setInterval(function(){ if(!document.hidden) Ink.FX.lantern(); }, 3400);
      setInterval(function(){ if(!document.hidden) Ink.FX.slash(); }, 2600);
    }, 3000);
  }

  /* ---------------- 还没写真心话的提醒 ---------------- */
  (function(){
    var joined = words.join("");
    var looksPlaceholder =
      joined.indexOf("把这几行换成") >= 0 ||
      joined.indexOf("还没有写下真心话") >= 0 ||
      /^[…\.\s]*$/.test(joined);
    if(looksPlaceholder){
      var h = $("editHint");
      h.innerHTML = "⚠ 你还没有写下真心话<br>打开同目录的 <b>配置.js</b>，把 <b>truelove → words</b> 里的「……」换成你想对" + honor + "说的话，保存后刷新即可。";
      h.classList.add("on");
    }
  })();

  /* ---------------- 交互 ---------------- */
  document.addEventListener("pointerdown", function(e){
    if(e.target && e.target.closest && e.target.closest("button")) return;
    Ink.FX.firework(e.clientX, e.clientY);
    Ink.FX.sparks(e.clientX, e.clientY, (Math.random()*6)|0, 18, 1.3);
    Ink.bell(Ink.rand(600,1000), 0.35, 0.03);
  });

  $("btnAgain").addEventListener("click", function(){ location.reload(); });
  $("btnHome").addEventListener("click", function(){ Ink.go("./index.html"); });

  document.addEventListener("keydown", function(e){
    if(e.key === "r" || e.key === "R") location.reload();
    if(e.key === "Escape"){ var c = $("controls"); if(c) c.classList.toggle("on"); }
  });

  /* ---------------- 启动 ---------------- */
  Ink.FX.start();
  Ink.controls({
    back: "./index.html",
    backText: "回到开头",
    hint: "轻 点 任 意 处 · 剑 绽 烟 花",
    hintDelay: 3200
  });

  Ink.reveal();
  setTimeout(function(){ Ink.act("第五幕 · 见字如面", "有些话，只想说给一个人听"); }, 420);
  setTimeout(function(){ letterEl.classList.add("open"); }, 1500);
  setTimeout(function(){ $("topline").classList.add("on"); }, 2900);
  setTimeout(startWriting, 3500);

  // 兜底：万一 requestAnimationFrame 被节流，也不至于卡住
  setTimeout(function(){
    if(!started) startWriting();
    if(!finished && started) setTimeout(function(){ if(!finished) finishWriting(); }, WRITE_TOTAL + 4000);
  }, 4200);
})();
</script>
</body>
</html>
