<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>剑影江湖</title>
<link rel="stylesheet" href="共享/墨韵.css">
<script src="配置.js"></script>
<script src="共享/墨韵.js"></script>
<style>
/* ============================================================================
   第一幕 · 序章「点剑成诗」
   她在屏幕上划动手指 → 拖出剑光 → 每划一剑，夜空里刻出一个鎏金大字。
   四个淡墨字先作为「待刻的底稿」铺在夜空里，划一剑点亮一个。
   背景 / 粒子 / 音效 / 转场来自「共享/墨韵」。
   ============================================================================ */

#ink{position:fixed;inset:0;z-index:5;touch-action:none;cursor:crosshair;display:block}

#stage{position:fixed;inset:0;z-index:6;display:flex;flex-direction:column;
  align-items:center;justify-content:center;pointer-events:none;
  padding:7vh 5vw;text-align:center}

.kicker{font-size:clamp(11px,1.7vh,15px);letter-spacing:.6em;text-indent:.6em;
  color:rgba(232,200,135,.62);margin-bottom:2.6vh;opacity:0}
.kicker.on{animation:inkLineIn 1.1s cubic-bezier(.2,.8,.25,1) .1s forwards}

.titlewrap{display:grid;justify-items:center;align-items:center;width:100%}
.titlewrap>*{grid-area:1 / 1}

.title,.ghost{display:flex;justify-content:center;align-items:baseline;
  gap:.06em;flex-wrap:nowrap;line-height:1.08}
.ghost{pointer-events:none;transition:opacity 1.4s ease}
.ghost.off{opacity:0}
.gch{font-family:"STKaiti","KaiTi","Kaiti SC","Songti SC",serif;font-weight:700;
  font-size:clamp(46px,9.4vh,96px);letter-spacing:.06em;
  color:rgba(232,200,135,.13);
  text-shadow:0 0 22px rgba(232,200,135,.06)}

.ch{font-family:"STKaiti","KaiTi","Kaiti SC","Songti SC",serif;font-weight:700;
  font-size:clamp(46px,9.4vh,96px);letter-spacing:.06em;
  background:linear-gradient(178deg,#fff6d2,#f0c465 38%,#a97c26 72%,#ffe7ab);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  opacity:0;clip-path:inset(0 0 100% 0);filter:blur(13px);will-change:clip-path,filter,opacity}
.ch.on{animation:carve .95s cubic-bezier(.2,.86,.24,1) forwards}
@keyframes carve{
  0%{opacity:0;clip-path:inset(0 0 100% 0);filter:blur(13px)}
  16%{opacity:1}
  74%{clip-path:inset(0 0 0 0);filter:blur(1.6px) drop-shadow(0 0 34px rgba(255,214,130,.85))}
  100%{opacity:1;clip-path:inset(0 0 0 0);
       filter:blur(0) drop-shadow(0 0 26px rgba(255,214,130,.9)) drop-shadow(0 0 66px rgba(255,176,52,.55))}
}
.title.done .ch{animation:none;opacity:1;clip-path:inset(0 0 0 0);
  filter:drop-shadow(0 0 26px rgba(255,214,130,.9)) drop-shadow(0 0 66px rgba(255,176,52,.55))}

.rule{width:0;height:1px;margin:3.4vh 0 0;
  background:linear-gradient(90deg,transparent,rgba(232,200,135,.75),transparent);
  transition:width 1.1s cubic-bezier(.2,.8,.25,1)}
.rule.on{width:min(62vw,520px)}

.sub{margin-top:2.8vh;font-size:clamp(12px,2vh,17px);letter-spacing:.42em;text-indent:.42em;
  color:rgba(232,200,135,.82);opacity:0;transform:translateY(9px)}
.sub.on{animation:inkLineIn 1s cubic-bezier(.2,.8,.25,1) forwards}

.sign{margin-top:1.6vh;font-size:clamp(11px,1.7vh,15px);letter-spacing:.3em;text-indent:.3em;
  color:rgba(232,200,135,.55);opacity:0;transform:translateY(9px)}
.sign.on{animation:inkLineIn 1s cubic-bezier(.2,.8,.25,1) .3s forwards}

.tipbar{margin-top:5vh;font-size:clamp(11px,1.8vh,16px);letter-spacing:.32em;text-indent:.32em;
  color:rgba(232,200,135,.62);transition:opacity .7s ease}
.tipbar b{color:#ffd98a;font-weight:600;text-shadow:0 0 14px rgba(255,214,130,.55)}

#go{margin-top:4.4vh;pointer-events:none;opacity:0;transform:translateY(14px);
  background:linear-gradient(180deg,#fff6d8,#e8c887 46%,#d6b463);color:#2a2115;
  font-weight:600;
  transition:opacity .9s ease,transform .9s cubic-bezier(.2,.8,.25,1),box-shadow .35s ease}
#go.on{opacity:1;transform:none;pointer-events:auto;
  box-shadow:0 0 34px rgba(232,200,135,.5),0 10px 26px rgba(0,0,0,.5)}
#go:hover{box-shadow:0 0 52px rgba(255,214,130,.75),0 10px 26px rgba(0,0,0,.5)}

/* 划动指引：一道掠过长空的光点 */
#nudge{position:fixed;left:0;right:0;top:30%;z-index:7;pointer-events:none;
  display:flex;justify-content:center;opacity:0;transition:opacity .9s ease}
#nudge.on{opacity:1}
#nudge i{display:block;width:16px;height:16px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,246,214,.95),rgba(255,214,130,.35) 45%,rgba(255,176,52,0) 72%);
  box-shadow:0 0 22px 6px rgba(255,214,130,.35);
  animation:nudgeMove 3.0s cubic-bezier(.45,0,.55,1) infinite}
@keyframes nudgeMove{
  0%{transform:translateX(-34vw) translateY(2vh) scale(.6);opacity:.25}
  20%{opacity:.95}
  50%{transform:translateX(0) translateY(-1vh) scale(1);opacity:1}
  80%{opacity:.95}
  100%{transform:translateX(34vw) translateY(2vh) scale(.6);opacity:.25}
}

@media (max-width:520px){
  .ch,.gch{font-size:clamp(40px,12vw,64px)}
  .sub{letter-spacing:.3em}
  .tipbar{letter-spacing:.2em}
}
</style>
</head>
<body>

<canvas id="ink"></canvas>

<div id="nudge"><i></i></div>

<div id="stage">
  <div class="kicker" id="kicker">第 一 幕 · 序 章</div>

  <div class="titlewrap">
    <div class="ghost" id="ghost"></div>
    <div class="title" id="title"></div>
  </div>

  <div class="rule" id="rule"></div>
  <div class="sub" id="sub"></div>
  <div class="sign" id="sign"></div>
  <div class="tipbar" id="tipbar"></div>
  <button class="btn-gold" id="go"></button>
</div>

<script>
(function(){
  "use strict";

  var S = window.SITE || {};
  var CONFIG = {
    title:    S.gameTitle || "剑影江湖",
    sub:      S.gameSub   || "武 侠 奇 旅 · 三 关 山 河",
    start:    S.startText || "踏 入 江 湖",
    honor:    S.honorific || "少侠",
    nextUrl:  "./02-焚香许愿.html",
    idleHelp: 13000
  };

  var $ = Ink.$;
  var cvs = $("ink"), ctx = cvs.getContext("2d");
  var kickerEl=$("kicker"), titleEl=$("title"), ghostEl=$("ghost"), ruleEl=$("rule"),
      subEl=$("sub"), signEl=$("sign"), tipEl=$("tipbar"), goEl=$("go"), nudgeEl=$("nudge");

  /* ---------------------------------------------------------- 标题字 */
  var chars = CONFIG.title.split("");
  if(chars.length > 6) chars = chars.slice(0, 6);
  var N = chars.length, done = 0;
  var chEls = [];
  for(var i=0;i<N;i++){
    var sp = document.createElement("span");
    sp.className = "ch"; sp.textContent = chars[i];
    titleEl.appendChild(sp); chEls.push(sp);

    var gp = document.createElement("span");   // 待刻的淡墨底稿
    gp.className = "gch"; gp.textContent = chars[i];
    ghostEl.appendChild(gp);
  }
  subEl.textContent  = CONFIG.sub;
  signEl.textContent = "谨 以 此 卷 · 赠 " + CONFIG.honor;
  goEl.textContent   = CONFIG.start;
  document.title     = CONFIG.title;
  setTip(0);

  function setTip(k){
    if(k === 0)      tipEl.innerHTML = "以 <b>指</b> 为 <b>剑</b> · 划 开 此 夜";
    else if(k < N)   tipEl.innerHTML = "已 出 <b>" + k + "</b> 剑 · 还 差 <b>" + (N-k) + "</b> 剑";
    else             tipEl.innerHTML = "";
  }

  /* ---------------------------------------------------------- 画布 */
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  function resize(){
    cvs.width  = Math.floor(innerWidth  * dpr);
    cvs.height = Math.floor(innerHeight * dpr);
    cvs.style.width  = innerWidth  + "px";
    cvs.style.height = innerHeight + "px";
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  resize();
  addEventListener("resize", resize);

  var strokes = [], cur = null, drawing = false;
  var now = function(){ return performance.now(); };

  function down(e){
    if(e.pointerType === "mouse" && e.button !== 0) return;
    drawing = true;
    cur = { pts:[{x:e.clientX,y:e.clientY,t:now()}] };
    strokes.push(cur);
    Ink.whoosh();
    try{ cvs.setPointerCapture(e.pointerId); }catch(err){}
    nudgeEl.classList.remove("on");
    kickIdle();
  }

  function move(e){
    if(!drawing || !cur) return;
    var p = cur.pts, last = p[p.length-1];
    var dx = e.clientX-last.x, dy = e.clientY-last.y;
    if(dx*dx+dy*dy < 9) return;
    p.push({x:e.clientX,y:e.clientY,t:now()});
    kickIdle();
  }

  function up(){
    if(!drawing) return;
    drawing = false;
    var s = cur; cur = null;
    if(!s) return;
    var len = 0;
    for(var k=1;k<s.pts.length;k++){
      var a=s.pts[k-1], b=s.pts[k];
      len += Math.hypot(b.x-a.x, b.y-a.y);
    }
    var last = s.pts[s.pts.length-1];

    if(len < 46){                      // 只是点了一下 → 当烟花
      strokes.pop();
      Ink.FX.firework(last.x, last.y);
      return;
    }
    Ink.FX.sparks(last.x, last.y, 0, 34, 1.7);
    Ink.bell(Ink.rand(560, 900), 0.5, 0.035);
    carve();
  }

  cvs.addEventListener("pointerdown", down);
  cvs.addEventListener("pointermove", move);
  cvs.addEventListener("pointerup", up);
  cvs.addEventListener("pointercancel", up);

  /* ---------------------------------------------------------- 刻字 */
  var idleTimer = null, finished = false;

  function kickIdle(){
    if(idleTimer) clearTimeout(idleTimer);
    if(finished) return;
    idleTimer = setTimeout(function(){
      if(finished) return;
      var step = function(){
        if(finished || done >= N) return;
        carve();
        if(done < N) setTimeout(step, 900);
      };
      step();
    }, CONFIG.idleHelp);
  }

  function carve(){
    if(finished || done >= N) return;
    var el = chEls[done];
    el.classList.add("on");
    done++;
    setTip(done);

    var r = el.getBoundingClientRect();
    var cx = r.left + r.width/2, cy = r.top + r.height/2;
    Ink.FX.shockwave(cx, cy, [255,232,180]);
    Ink.bell([523.25,587.33,659.25,783.99,880,987.77][(done-1)%6], 1.1, 0.055);

    if(done >= N) setTimeout(finish, 620);
  }

  /* ---------------------------------------------------------- 完成 */
  function finish(){
    if(finished) return;
    finished = true;
    if(idleTimer) clearTimeout(idleTimer);
    nudgeEl.classList.remove("on");
    tipEl.style.opacity = "0";

    titleEl.classList.add("done");
    ghostEl.classList.add("off");
    ruleEl.classList.add("on");

    var r = titleEl.getBoundingClientRect();
    var cx = r.left + r.width/2, cy = r.top + r.height/2;

    Ink.flash(0.84, 760);
    Ink.shake(680);
    Ink.whoosh();
    Ink.FX.swords(cx, cy, 72);
    Ink.FX.barrage(13);
    Ink.bell(261.63, 2.0, 0.075);

    setTimeout(function(){ subEl.classList.add("on");  }, 900);
    setTimeout(function(){ signEl.classList.add("on"); }, 1200);
    setTimeout(function(){ goEl.classList.add("on");   }, 1750);
    setTimeout(function(){ for(var k=0;k<6;k++) Ink.FX.lantern(); }, 1900);

    setInterval(function(){
      if(document.hidden) return;
      Ink.FX.firework(Ink.rand(innerWidth*0.08, innerWidth*0.92),
                      Ink.rand(innerHeight*0.08, innerHeight*0.5));
    }, 2600);
    setInterval(function(){ if(!document.hidden) Ink.FX.lantern(); }, 4200);
    setInterval(function(){ if(!document.hidden) Ink.FX.slash(); }, 3400);
  }

  /* ---------------------------------------------------------- 剑痕绘制 */
  function paint(){
    requestAnimationFrame(paint);
    var t = performance.now();
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    ctx.globalCompositeOperation = "lighter";
    ctx.lineCap = "round"; ctx.lineJoin = "round";

    for(var i=strokes.length-1;i>=0;i--){
      var s = strokes[i];
      var newest = s.pts[s.pts.length-1];
      if(s !== cur && t - newest.t > 1250){ strokes.splice(i,1); continue; }

      for(var k=1;k<s.pts.length;k++){
        var a = s.pts[k-1], b = s.pts[k];
        var life = 1 - Math.max(0, (t - b.t) / 1150);
        if(life <= 0) continue;
        var taper = Math.min(1, k / 5);

        ctx.strokeStyle = "rgba(255,232,170," + (life*0.20*taper) + ")";
        ctx.lineWidth   = 17 * life * taper;
        ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();

        ctx.strokeStyle = "rgba(255,246,214," + (life*0.85*taper) + ")";
        ctx.lineWidth   = 3.4 * life * taper;
        ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
      }

      if(s === cur && s.pts.length){
        var tip = s.pts[s.pts.length-1];
        var g = ctx.createRadialGradient(tip.x,tip.y,0,tip.x,tip.y,36);
        g.addColorStop(0,"rgba(255,250,225,.95)");
        g.addColorStop(.35,"rgba(255,214,130,.45)");
        g.addColorStop(1,"rgba(255,176,52,0)");
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(tip.x,tip.y,36,0,6.2832); ctx.fill();
      }
    }
    ctx.globalCompositeOperation = "source-over";
  }
  requestAnimationFrame(paint);

  /* ---------------------------------------------------------- 启动 */
  goEl.addEventListener("click", function(){ Ink.go(CONFIG.nextUrl); });

  document.addEventListener("keydown", function(e){
    if((e.key === " " || e.key === "Enter") && finished) Ink.go(CONFIG.nextUrl);
  });

  Ink.FX.start();
  Ink.controls({});
  Ink.reveal();

  setTimeout(function(){ kickerEl.classList.add("on"); }, 200);
  setTimeout(function(){ if(!finished) nudgeEl.classList.add("on"); }, 1200);
  setTimeout(function(){
    if(!finished && done === 0){
      tipEl.innerHTML = "在 屏 幕 上 <b>划 一 下</b> 就 好";
      kickIdle();
    }
  }, CONFIG.idleHelp);
  kickIdle();
})();
</script>
</body>
</html>
